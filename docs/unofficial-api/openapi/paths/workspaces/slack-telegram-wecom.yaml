# Domain: Slack + Telegram + WeCom channel integrations.
# Source: server/internal/handler/slack.go, telegram.go, wecom_web.go,
# router.go:1836-1868. Binding-token redemption endpoints
# (/api/{slack,telegram,wecom}/binding/redeem) are a different ticket's scope
# (G8) and are NOT documented here.
#
# Common pattern across all three channels: GET (list) requires only
# workspace membership and degrades to `configured: false` + empty list
# rather than erroring when the at-rest encryption key (or, for WeCom, any of
# its 3 dependencies) is unset. DELETE (revoke) and POST (BYO install) both
# require `owner` or `admin` and 403 with a `*_not_configured` code when the
# integration isn't configured. None of the three list/response types ever
# include the raw bot token/secret.

/api/workspaces/{id}/slack/installations:
  get:
    operationId: listSlackInstallations
    summary: List the workspace's Slack app installations
    description: slack.go:56-83 (`ListSlackInstallations`). Member-visible.
    tags: [Workspaces, Slack]
    security: &auth
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - CloudNodePAT: []
      - BrowserSession: []
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SlackInstallationsListResponse'}
      '400':
        description: Invalid workspace id.
        content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
      '500':
        description: Query failed.
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Error'}
            example: {error: "failed to list slack installations"}

/api/workspaces/{id}/slack/installations/{installationId}:
  delete:
    operationId: revokeSlackInstallation
    summary: Revoke a Slack app installation
    description: >-
      slack.go:182-217 (`RevokeSlackInstallation`). Requires `owner` or
      `admin`. Soft-delete (status -> 'revoked', row preserved for audit /
      reinstall).
    tags: [Workspaces, Slack]
    security: *auth
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: installationId
        in: path
        required: true
        schema: {type: string, format: uuid}
    responses:
      '204':
        description: Revoked.
      '400':
        description: Invalid workspace id or installation id.
        content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
      '403':
        description: Slack integration not configured, or caller is not owner/admin.
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ErrorCode'}
            example: {error: "slack integration not configured", code: slack_not_configured}
      '404':
        description: No Slack installation with this id in this workspace.
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Error'}
            example: {error: "slack installation not found"}
      '500':
        description: Loading the installation, or the revoke, failed.
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Error'}

/api/workspaces/{id}/slack/install/byo:
  post:
    operationId: registerSlackBYO
    summary: Register a user-supplied ("bring your own") Slack app for an agent
    description: >-
      slack.go:98-168 (`RegisterSlackBYO`). Requires `owner` or `admin`. Lets
      several agents in the same Slack workspace each have their own bot
      identity. Broadcasts `slack_installation:created` on success.
    tags: [Workspaces, Slack]
    security: *auth
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: agent_id
        in: query
        required: true
        schema: {type: string, format: uuid}
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RegisterSlackBYORequest'}
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SlackInstallationResponse'}
      '400':
        description: Invalid workspace/agent/user id, missing `agent_id`, invalid body, or the tokens themselves failed verification.
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Error'}
            examples:
              missingAgent: {value: {error: "agent_id is required"}}
              invalidBody: {value: {error: "invalid request body"}}
              verifyFailed: {value: {error: "could not verify the Slack tokens — check the bot token and app-level token, that the app is installed to your workspace, and that it has the users:read scope"}}
      '403':
        description: Slack integration not configured, or caller is not owner/admin.
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ErrorCode'}
            example: {error: "slack integration not configured", code: slack_not_configured}
      '404':
        description: No agent with `agent_id` in this workspace.
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Error'}
            example: {error: "agent not found in this workspace"}
      '409':
        description: This Slack app is already connected to another agent in the same workspace, to an archived agent, or to a different Multica workspace.
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Error'}
            examples:
              sameWorkspace: {value: {error: "this Slack app is already connected to another agent in this workspace — disconnect it there first, then connect it here"}}
              archived: {value: {error: "this Slack app is connected to an archived agent in this workspace — restore that agent, or disconnect its app, before connecting it here"}}
              otherWorkspace: {value: {error: "this Slack app is already connected to a different Multica workspace — disconnect it there before connecting it here"}}

