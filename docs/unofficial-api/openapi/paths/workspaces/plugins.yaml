# Domain: Plugins.
# Source: server/internal/handler/plugin.go, plugin_package.go, plugin_mcp.go,
# plugin_surface.go, plugin_hook.go; router.go:1692-1786.
#
# Common to all 17 operations below:
# - Gated by `requirePluginsV1` (feature flag) FIRST, before any other check:
#   403 {error: "Plugin management is not enabled", code: "plugin_api_disabled"}.
# - `writePluginError` (plugin.go:30-52) maps a `service.PluginError.Kind` to
#   a status: invalid->400, not_found->404, conflict->409, forbidden->403,
#   incompatible->422, quota->507, anything else (including "unavailable")
#   ->502 default. A non-PluginError err is 500. All of these use the plain
#   `Error` schema (`{error}`, no `code`) — `writePluginError` never calls
#   `writeErrorCode`.
# - GET /plugins and GET .../surfaces/.../launch require only membership;
#   every other operation below requires `owner` or `admin`
#   (RequireWorkspaceRoleFromURL, router.go:1734).

/api/workspaces/{id}/plugins:
  get:
    operationId: listPlugins
    summary: List installed Plugins
    description: plugin.go:181-204 (`ListPlugins`). Member-visible.
    tags: [Workspaces, Plugins]
    security: &auth
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - CloudNodePAT: []
      - BrowserSession: []
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: object
              required: [plugins]
              properties:
                plugins: {type: array, items: {$ref: '#/components/schemas/PluginInstallationResponse'}}
      '403':
        description: Plugin management feature flag disabled.
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ErrorCode'}
            example: {error: "Plugin management is not enabled", code: plugin_api_disabled}
      '500':
        description: Listing or payload-building failed.
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Error'}
            example: {error: "failed to list Plugins"}
  post:
    operationId: installPlugin
    summary: Install a Plugin (step two)
    description: >-
      plugin.go:235-270 (`InstallPlugin`). Step two of the two-step install —
      should reuse the `version_id` a prior `POST .../plugins/preview` call
      returned, so the consented manifest and the executed code are
      guaranteed to be the same artifact. Owner/admin only.
    tags: [Workspaces, Plugins]
    security: *auth
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/InstallPluginRequest'}
    responses:
      '201':
        description: Installed
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PluginInstallationResponse'}
      '400':
        description: Invalid workspace id, invalid body, or PluginError(invalid).
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Error'}
            example: {error: "invalid request body"}
      '403':
        description: Plugin management disabled, or PluginError(forbidden).
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Error'}
      '404':
        description: PluginError(not_found) — unknown version_id.
        content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
      '409':
        description: Already installed, or `granted_scopes` does not exactly match the manifest's scopes.
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Error'}
            examples:
              alreadyInstalled: {value: {error: "this plugin is already installed in this workspace"}}
              scopeMismatch: {value: {error: "granted_scopes contains \"repo:write\", which the manifest does not request"}}
      '422':
        description: PluginError(incompatible) — manifest incompatible with this deployment.
        content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
      '500':
        description: Payload-building after install failed.
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Error'}
            example: {error: "failed to install the Plugin"}
      '502':
        description: PluginError default/unavailable kind.
        content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
      '507':
        description: PluginError(quota).
        content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}

/api/workspaces/{id}/plugins/preview:
  post:
    operationId: previewPlugin
    summary: Preview a Plugin before installing (step one)
    description: >-
      plugin.go:206-233 (`PreviewPlugin`). Writes nothing — lets the
      administrator see the scope list and manifest before consenting.
      Owner/admin only.
    tags: [Workspaces, Plugins]
    security: *auth
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PreviewPluginRequest'}
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PluginPreviewResponse'}
      '400':
        description: Invalid workspace id, invalid body, or PluginError(invalid).
        content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
      '403':
        description: Plugin management disabled, or PluginError(forbidden).
        content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
      '404':
        description: PluginError(not_found) — unknown version_id.
        content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
      '422':
        description: PluginError(incompatible).
        content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
      '502':
        description: PluginError default/unavailable kind.
        content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}

/api/workspaces/{id}/plugins/packages:
  get:
    operationId: listPluginPackages
    summary: List published Plugin packages
    description: plugin_package.go:21-35 (`ListPluginPackages`). Owner/admin only.
    tags: [Workspaces, Plugins]
    security: *auth
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: object
              required: [packages]
              properties:
                packages: {type: array, items: {$ref: '#/components/schemas/PluginPackageSummary'}}
      '403':
        description: Plugin management disabled, or caller not owner/admin.
        content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
      '502':
        description: PluginError default kind (fallback "failed to list published Plugins").
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Error'}
            example: {error: "failed to list published Plugins"}
  post:
    operationId: publishPluginPackage
    summary: Publish a Plugin package from an uploaded bundle
    description: >-
      plugin_package.go:42-92 (`PublishPluginPackage`). Multipart upload, NOT
      a JSON body. Max size is `plugincontract.MaxBundleSize` plus a 64 KiB
      multipart overhead allowance. Owner/admin only.
    tags: [Workspaces, Plugins]
    security: *auth
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [bundle]
            properties:
              bundle: {type: string, format: binary, description: "Zip archive of the plugin bundle."}
    responses:
      '201':
        description: Published
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PluginPackageSummary'}
      '400':
        description: No `bundle` field in the form, the bundle could not be read, or PluginError(invalid) — manifest/bundle validation failure (e.g. incomplete surface).
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Error'}
            examples:
              missing: {value: {error: "a Plugin package file is required"}}
              readFailed: {value: {error: "failed to read the Plugin package"}}
      '403':
        description: Plugin management disabled, or caller not owner/admin.
        content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
      '413':
        description: Malformed/oversized multipart form, or the bundle itself exceeds the size cap.
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Error'}
            examples:
              malformed: {value: {error: "the Plugin package upload is too large or malformed"}}
              tooLarge: {value: {error: "the Plugin package is too large"}}

/api/workspaces/{id}/plugins/packages/local:
  post:
    operationId: publishLocalPluginPackage
    summary: Publish a Plugin package from a local dev directory
    description: >-
      plugin_package.go:99-135 (`PublishLocalPluginPackage`). Dev-only
      channel: loads from a subdirectory of `MULTICA_PLUGIN_DIR`. Owner/admin
      only.
    tags: [Workspaces, Plugins]
    security: *auth
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PublishLocalPluginRequest'}
    responses:
      '201':
        description: Published
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PluginPackageSummary'}
      '400':
        description: Invalid body, empty/unsafe name, or PluginError(invalid) (e.g. `MULTICA_PLUGIN_DIR` unset).
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Error'}
            example: {error: "invalid request body"}
      '403':
        description: Plugin management disabled, or caller not owner/admin.
        content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}

/api/workspaces/{id}/plugins/packages/{packageId}:
  delete:
    operationId: deletePluginPackage
    summary: Delete a published Plugin package
    description: plugin_package.go:138-151 (`DeletePluginPackage`). Owner/admin only.
    tags: [Workspaces, Plugins]
    security: *auth
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: packageId
        in: path
        required: true
        schema: {type: string, format: uuid}
    responses:
      '204':
        description: Deleted.
      '403':
        description: Plugin management disabled, or caller not owner/admin.
        content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
      '404':
        description: PluginError(not_found).
        content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
      '409':
        description: PluginError(conflict) (e.g. package has installed versions in use — not independently re-verified from this file alone).
        content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}

/api/workspaces/{id}/plugins/{installationId}:
