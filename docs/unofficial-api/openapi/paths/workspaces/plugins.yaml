      - name: installationId
        in: path
        required: true
        schema: {type: string, format: uuid}
    responses:
      '204':
        description: Uninstalled.
      '403':
        description: Plugin management disabled, or caller not owner/admin.
        content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
      '404':
        description: PluginError(not_found).
        content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}

/api/workspaces/{id}/plugins/{installationId}/invocations:
  get:
    operationId: listPluginInvocations
    summary: List a Plugin installation's recent hook invocations
    description: >-
      plugin_hook.go:125-168 (`ListPluginInvocations`). Owner/admin only
      (installation-scoped routes sit in the admin group). Bodies were never
      stored — this answers "what happened and how often", not "what was
      sent". Capped at the 100 most recent, no further pagination.
    tags: [Workspaces, Plugins]
    security: *auth
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: installationId
        in: path
        required: true
        schema: {type: string, format: uuid}
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: object
              required: [invocations]
              properties:
                invocations: {type: array, items: {$ref: '#/components/schemas/PluginInvocationResponse'}}
      '403':
        description: Plugin management disabled, or caller not owner/admin.
        content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
      '500':
        description: Query failed.
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Error'}
            example: {error: "failed to load the Plugin activity"}

/api/workspaces/{id}/plugins/{installationId}/token:
  post:
    operationId: rotatePluginToken
    summary: Rotate a Plugin installation's inbound token
    description: >-
      plugin_hook.go:181-192 (`RotatePluginToken`). Owner/admin only. The
      token and signing secret are returned exactly once, on this call — no
      read endpoint exists; a lost token must be rotated again, not recovered.
    tags: [Workspaces, Plugins]
    security: *auth
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: installationId
        in: path
        required: true
        schema: {type: string, format: uuid}
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PluginTokenResponse'}
      '403':
        description: Plugin management disabled, or caller not owner/admin.
        content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
      '404':
        description: PluginError(not_found).
        content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  delete:
    operationId: revokePluginToken
    summary: Revoke a Plugin installation's inbound token
    description: plugin_hook.go:195-205 (`RevokePluginToken`). Owner/admin only.
    tags: [Workspaces, Plugins]
    security: *auth
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: installationId
        in: path
        required: true
        schema: {type: string, format: uuid}
    responses:
      '204':
        description: Revoked.
      '403':
        description: Plugin management disabled, or caller not owner/admin.
        content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
      '404':
        description: PluginError(not_found).
        content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}

/api/workspaces/{id}/plugins/{installationId}/mcp/{hookKey}/tools:
  get:
    operationId: listPluginMCPTools
    summary: Discover an MCP hook's available tools
    description: >-
      plugin_mcp.go:32-58 (`ListPluginMCPTools`). Owner/admin only. Read-only
      discovery — adopts nothing; `approved`/`drifted` reflect previously
      approved state compared against the live schema digest.
    tags: [Workspaces, Plugins]
    security: *auth
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: installationId
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: hookKey
        in: path
        required: true
        schema: {type: string}
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: object
              required: [tools]
              properties:
                tools: {type: array, items: {$ref: '#/components/schemas/PluginMCPToolResponse'}}
      '403':
        description: Plugin management disabled, or caller not owner/admin.
        content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
      '404':
        description: PluginError(not_found) — unknown installation/hookKey.
        content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
      '502':
        description: PluginError default/unavailable — could not reach the Plugin's MCP server.
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Error'}
            example: {error: "failed to reach the Plugin's MCP server"}
  put:
    operationId: approvePluginMCPTools
    summary: Set an MCP hook's approved tool set
    description: >-
      plugin_mcp.go:68-100 (`ApprovePluginMCPTools`). Owner/admin only.
      `tools` is the COMPLETE approved set, not a delta — omitting a
      previously-approved name revokes it. Tools are pinned by schema digest.
    tags: [Workspaces, Plugins]
    security: *auth
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: installationId
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: hookKey
        in: path
        required: true
        schema: {type: string}
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApprovePluginMCPToolsRequest'}
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PluginInstallationResponse'}
      '400':
        description: Invalid body, or PluginError(invalid).
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Error'}
            example: {error: "invalid request body"}
      '401':
        description: Not authenticated (`requireUserID`).
        content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
      '403':
        description: Plugin management disabled, or caller not owner/admin.
        content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
      '404':
        description: PluginError(not_found).
        content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}

/api/workspaces/{id}/plugins/{installationId}/config:
  put:
    operationId: configurePlugin
    summary: Set a Plugin installation's configuration values
    description: >-
      plugin.go:272-298 (`ConfigurePlugin`). Owner/admin only. Secret fields
      route to a separate encrypted table (`SetConfig`); the response's
      `config` never echoes them back, only `configured_secrets` (names).
    tags: [Workspaces, Plugins]
    security: *auth
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: installationId
        in: path
        required: true
        schema: {type: string, format: uuid}
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ConfigurePluginRequest'}
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PluginInstallationResponse'}
      '400':
        description: Invalid body, or PluginError(invalid) — unknown field, non-string value, or secret value exceeds the byte cap.
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Error'}
            examples:
              invalidBody: {value: {error: "invalid request body"}}
              unknownField: {value: {error: "unknown config field \"timeout\""}}
              notString: {value: {error: "config field \"api_key\" must be a string"}}
      '403':
        description: Plugin management disabled, or caller not owner/admin.
        content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
      '404':
        description: PluginError(not_found).
        content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}

/api/workspaces/{id}/plugins/{installationId}/enable:
  post:
    operationId: enablePlugin
    summary: Enable a Plugin installation
    description: plugin.go:300-303 (`EnablePlugin`, shares `setPluginEnabled` with Disable). Owner/admin only.
    tags: [Workspaces, Plugins]
    security: *auth
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: installationId
        in: path
        required: true
        schema: {type: string, format: uuid}
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PluginInstallationResponse'}
      '403':
        description: Plugin management disabled, or caller not owner/admin.
        content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
      '404':
        description: PluginError(not_found).
        content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}

/api/workspaces/{id}/plugins/{installationId}/disable:
  post:
    operationId: disablePlugin
    summary: Disable a Plugin installation
    description: plugin.go:305-308 (`DisablePlugin`, shares `setPluginEnabled` with Enable). Owner/admin only.
    tags: [Workspaces, Plugins]
    security: *auth
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: installationId
        in: path
        required: true
        schema: {type: string, format: uuid}
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PluginInstallationResponse'}
      '403':
        description: Plugin management disabled, or caller not owner/admin.
        content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
      '404':
        description: PluginError(not_found).
        content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}

/api/workspaces/{id}/plugins/{installationId}/surfaces/{surfaceKey}/launch:
  get:
    operationId: getPluginSurfaceLaunch
    summary: Get a short-lived launch descriptor for a hosted Plugin surface
    description: >-
      plugin_surface.go:152-214 (`GetPluginSurfaceLaunch`). Member-visible
      (not admin-gated) — opening an issue is what triggers this, not an
      admin action. Returns a 2-minute-TTL bridge token and launch URL, never
      the surface's executable bytes. Response sent with
      `Cache-Control: private, no-store`.
    tags: [Workspaces, Plugins]
    security: *auth
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: installationId
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: surfaceKey
        in: path
        required: true
        schema: {type: string}
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PluginSurfaceLaunchResponse'}
      '400':
        description: Invalid workspace id.
        content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
      '403':
        description: >-
          Plugin management disabled; surfaces not configured on this
          deployment (`plugin_surfaces_not_configured`); or the installation
          is disabled.
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ErrorCode'
                - $ref: '#/components/schemas/Error'
            examples:
              surfacesNotConfigured: {value: {error: "Plugin surfaces are not configured", code: plugin_surfaces_not_configured}}
              disabledPlugin: {value: {error: "this Plugin is disabled"}}
      '404':
        description: PluginError(not_found) — unknown installation/surfaceKey.
        content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
      '500':
        description: Misconfigured surface signing (origin parsing/derivation failure).
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ErrorCode'}
            example: {error: "Plugin surfaces are misconfigured", code: plugin_surfaces_misconfigured}
