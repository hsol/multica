# Domain: 이슈 보조 리소스 — labels, properties, issue-statuses, issue-views
# (+ view-bar preferences), pins, quick-actions (29 endpoints).
# Source: server/internal/handler/{label,property,issue_status,issue_view,
# issue_view_preference,pin,quick_action}.go (baseline revision
# ba30324e10dfc69fb0f0a6732dd3d0f0559e01fe).
#
# All 29 operations below live inside the single workspace-scoped route
# group in server/cmd/server/router.go (~line 1983:
# `r.Group(func(r chi.Router) { r.Use(middleware.RequireWorkspaceMember(queries)) ... })`),
# itself nested under the outer `middleware.Auth` group. Every operation
# therefore:
#   - accepts the same 4 credentials middleware.Auth dispatches on
#     (PersonalAccessToken / AgentTaskToken / CloudNodePAT / BrowserSession —
#     see components/securitySchemes.yaml; CloudNodePAT resolves to a real
#     X-User-ID via the cloud-fleet owner lookup, so it satisfies
#     RequireWorkspaceMember like any other credential, unlike the `/api/me`
#     family some other domain tickets scoped to 4 schemes vs. 3 — included
#     here per "구현이 정본": server/internal/middleware/auth.go ~line 183);
#   - requires X-Workspace-ID or X-Workspace-Slug to resolve a workspace,
#     and a valid user to resolve a member — both enforced by
#     RequireWorkspaceMember (server/internal/middleware/workspace.go
#     ~line 195). The exact failure split is:
#       400 "workspace_id or workspace_slug is required" — neither header present
#       400 "invalid workspace_id" — header value is not a UUID (direct ID path only)
#       401 "user not authenticated" — no resolvable user from the credential
#       404 "workspace not found" — header resolved, but no membership row
#         for this user in that workspace
#     These four are common to literally every operation below via the
#     shared middleware and are NOT repeated per-operation (matching the
#     precedent set by the already-reviewed account.yaml / issues-comments
#     domain files) — only each handler's OWN additional validation and
#     authorization branches are documented per-operation.

/api/quick-actions:
  get:
    operationId: listQuickActions
    summary: List the workspace's quick action catalog
    description: >-
      server/internal/handler/quick_action.go:487-520 (`ListQuickActions`).
      No permission filtering beyond `private` ownership — every other row
      (including one whose bound target the caller cannot invoke) is
      returned to every member; RunQuickAction is the only place invoke
      permission is checked.
    tags: [Quick Actions]
    security: &workspaceAuth
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - CloudNodePAT: []
      - BrowserSession: []
    parameters: &workspaceHeaders
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: include_archived
        in: query
        required: false
        schema: { type: string, enum: ["true", "false"] }
        description: Exact string "true"; any other value (including absence) excludes archived (status=archived) actions.
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: object
              required: [quick_actions]
              properties:
                quick_actions:
                  type: array
                  items: { $ref: '#/components/schemas/QuickActionResponse' }
      '500':
        description: '"failed to list quick actions".'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
  post:
    operationId: createQuickAction
    summary: Create a quick action
    description: >-
      server/internal/handler/quick_action.go:522-594 (`CreateQuickAction`).
      Agent actors are rejected outright. A `public` action additionally
      requires owner/admin; a `private` one may be created by any member.
      Capped at 30 active actions per workspace.
    tags: [Quick Actions]
    security: *workspaceAuth
    parameters: *workspaceHeaders
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CreateQuickActionRequest' }
    responses:
      '201':
        description: Created
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuickActionResponse' }
      '400':
        description: Invalid body, invalid visibility, name/prompt/description validation failure, invalid assignee_type/assignee_id, assignee not found in this workspace, a public action bound to a non-everyone-invocable agent, or the 30-active-action cap reached.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            examples:
              invalidBody: { value: { error: "invalid request body" } }
              visibility: { value: { error: "visibility must be \"public\" or \"private\"" } }
              name: { value: { error: "name is required" } }
              assigneeType: { value: { error: "assignee_type must be \"agent\" or \"squad\"" } }
              prompt: { value: { error: "template variables are not supported yet; remove {{issue.title}} — the agent already reads this issue" } }
              mention: { value: { error: "the prompt cannot @mention an agent, squad, or person; a quick action reaches exactly the one target it is bound to (an issue link is fine)" } }
              targetNotFound: { value: { error: "assignee not found in this workspace" } }
              notInvocable: { value: { error: "a public quick action must use an agent every workspace member can trigger; make the agent public or set this action to private" } }
              cap: { value: { error: "a workspace can have at most 30 active quick actions; archive one first" } }
      '403':
        description: Caller is an agent actor (forbidden from managing quick actions at all), or a `public` action requires owner/admin and the caller has neither role.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            examples:
              agentActor: { value: { error: "agents cannot manage quick actions" } }
              role: { value: { error: "insufficient permissions" } }
      '500':
        description: '"failed to create quick action".'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }

/api/quick-actions/{id}:
  patch:
    operationId: updateQuickAction
    summary: Update a quick action
    description: >-
      server/internal/handler/quick_action.go:596-715 (`UpdateQuickAction`).
      All body fields optional. The role gate is evaluated against the
      RESULTING visibility (so flipping private -> public requires
      owner/admin) and also reapplied if the action is ALREADY public (so a
      member cannot rewrite a public action's prompt without the role).
      assignee_type/assignee_id move together and are re-validated against
      the resulting visibility even when only one of the two changes.
    tags: [Quick Actions]
    security: *workspaceAuth
    parameters:
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/UpdateQuickActionRequest' }
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuickActionResponse' }
      '400':
        description: Invalid body, invalid visibility/name/description/prompt/assignee, assignee not found or not everyone-invocable for a public action, invalid status value, or reactivating would exceed the 30-active-action cap.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            examples:
              invalidBody: { value: { error: "invalid request body" } }
              status: { value: { error: "status must be \"active\" or \"archived\"" } }
              cap: { value: { error: "a workspace can have at most 30 active quick actions" } }
      '403':
        description: Caller is an agent actor, or the (resulting or existing) visibility is public and the caller lacks owner/admin.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            examples:
              agentActor: { value: { error: "agents cannot manage quick actions" } }
              role: { value: { error: "insufficient permissions" } }
      '404':
        description: 'Quick action not found in this workspace, or (per loadReachableQuickAction) exists but is `private` and owned by someone else — both report identically so a foreign private action''s existence never leaks.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "quick action not found" }
      '500':
        description: '"failed to update quick action".'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
  delete:
    operationId: deleteQuickAction
    summary: Delete a quick action
    description: >-
      server/internal/handler/quick_action.go:717-751 (`DeleteQuickAction`).
      A `public` action is workspace furniture and requires owner/admin; a
      `private` one may only be deleted by its own creator (403 for anyone
      else, including other owner/admins).
    tags: [Quick Actions]
    security: *workspaceAuth
    parameters:
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      '204':
        description: Deleted.
      '403':
        description: Caller is an agent actor; the action is public and the caller lacks owner/admin; or the action is private and the caller is not its creator.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            examples:
              agentActor: { value: { error: "agents cannot manage quick actions" } }
              role: { value: { error: "insufficient permissions" } }
              notCreator: { value: { error: "only the creator can delete a private quick action" } }
      '404':
        description: Quick action not found in this workspace (or a foreign private one).
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "quick action not found" }
      '500':
        description: '"failed to delete quick action".'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }

/api/properties:
  get:
    operationId: listProperties
    summary: List the workspace's custom issue property definitions
    description: server/internal/handler/property.go:421-442 (`ListProperties`). Readable by any member; no role gate.
    tags: [Properties]
    security: *workspaceAuth
    parameters:
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: include_archived
        in: query
        required: false
        schema: { type: string, enum: ["true", "false"] }
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: object
              required: [properties, total]
              properties:
                properties:
                  type: array
                  items: { $ref: '#/components/schemas/PropertyResponse' }
                total: { type: integer }
      '500':
        description: '"failed to list properties".'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
  post:
    operationId: createProperty
    summary: Create a custom issue property definition
    description: >-
      server/internal/handler/property.go:467-542 (`CreateProperty`).
      Human owner/admin members only — agent actors are rejected outright,
      regardless of role, so an admin's agent cannot mass-create fields.
      Capped at 20 active definitions per workspace (checked atomically
      under an advisory lock against concurrent creates/unarchives).
    tags: [Properties]
    security: *workspaceAuth
    parameters:
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CreatePropertyRequest' }
    responses:
      '201':
        description: Created
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PropertyResponse' }
      '400':
        description: Invalid body, invalid name (empty, too long, control characters, or reserved), invalid type, description too long, invalid icon, invalid/missing select config, or the 20-active-definition cap reached.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            examples:
              invalidBody: { value: { error: "invalid request body" } }
              reserved: { value: { error: "\"status\" is reserved for a built-in issue field" } }
              invalidType: { value: { error: "invalid type \"foo\"; valid types: text, number, select, multi_select, date, checkbox, url, actor, multi_actor" } }
              noOptions: { value: { error: "select properties require at least one option" } }
              cap: { value: { error: "a workspace cannot have more than 20 active properties; archive unused ones first" } }
      '403':
        description: Caller is an agent actor, or a human member without owner/admin.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            examples:
              agentActor: { value: { error: "agents cannot manage property definitions" } }
              role: { value: { error: "insufficient permissions" } }
      '409':
        description: A property with that (normalized) name already exists in this workspace.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "a property with that name already exists" }
      '500':
        description: '"failed to create property".'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }

/api/properties/{id}:
  get:
    operationId: getProperty
    summary: Get a custom issue property definition
    description: server/internal/handler/property.go:444-465 (`GetProperty`). Readable by any member; no role gate.
    tags: [Properties]
    security: *workspaceAuth
    parameters:
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PropertyResponse' }
      '404':
        description: Property not found in this workspace.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "property not found" }
      '500':
        description: '"failed to get property".'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
  patch:
    operationId: updateProperty
    summary: Update a custom issue property definition
    description: >-
      server/internal/handler/property.go:544-665 (`UpdateProperty`). Human
      owner/admin only, like create. All body fields optional. Removing a
      select option still referenced by at least one issue is rejected with
      409 naming the options and their usage counts; `archived: false` is
      rejected once the workspace is back at the 20-active cap. The whole
      read-validate-write flow runs under the workspace + property advisory
      locks shared with SetIssueProperty, closing a TOCTOU between a config
      edit's usage census and a concurrent value write.
    tags: [Properties]
    security: *workspaceAuth
    parameters:
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/UpdatePropertyRequest' }
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PropertyResponse' }
      '400':
        description: Invalid body, invalid name/description/icon/config, or reactivating (archived:false) would exceed the 20-active cap.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            examples:
              invalidBody: { value: { error: "invalid request body" } }
              cap: { value: { error: "a workspace cannot have more than 20 active properties; archive unused ones first" } }
      '403':
        description: Caller is an agent actor, or a human member without owner/admin.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            examples:
              agentActor: { value: { error: "agents cannot manage property definitions" } }
              role: { value: { error: "insufficient permissions" } }
      '404':
        description: Property not found in this workspace.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "property not found" }
      '409':
        description: Renaming to a name already in use, or removing select options still referenced by at least one issue.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            examples:
              nameTaken: { value: { error: "a property with that name already exists" } }
              optionsInUse: { value: { error: "cannot remove options still in use: \"Critical\" (3 issues); clear or change those values first" } }
      '500':
        description: '"failed to update property".'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }

/api/labels:
  get:
    operationId: listLabels
    summary: List the workspace's label catalog
    description: server/internal/handler/label.go:144-164 (`ListLabels`). Readable by any member; `resource_type` filters the catalog (issue/agent/skill share one table).
    tags: [Labels]
    security: *workspaceAuth
    parameters:
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: resource_type
        in: query
        required: false
        schema: { type: string, enum: [issue, agent, skill], default: issue }
        description: Empty/omitted defaults to "issue".
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: object
              required: [labels, total]
              properties:
                labels:
                  type: array
                  items: { $ref: '#/components/schemas/LabelResponse' }
                total: { type: integer }
      '400':
        description: resource_type is not one of issue/agent/skill.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "resource_type must be issue, agent, or skill" }
      '500':
        description: '"failed to list labels".'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
  post:
    operationId: createLabel
    summary: Create a label
    description: server/internal/handler/label.go:192-238 (`CreateLabel`). No role gate — any member may create a label of any resource_type.
    tags: [Labels]
    security: *workspaceAuth
    parameters:
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CreateLabelRequest' }
    responses:
      '201':
        description: Created
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LabelResponse' }
      '400':
        description: Invalid body, invalid/empty/too-long/control-character name, invalid color, or invalid resource_type.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            examples:
              invalidBody: { value: { error: "invalid request body" } }
              name: { value: { error: "name is required" } }
              color: { value: { error: "color must be a 6-digit hex value like #3b82f6" } }
              resourceType: { value: { error: "resource_type must be issue, agent, or skill" } }
      '409':
        description: A label with that name already exists (within this workspace + resource_type).
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "a label with that name already exists" }
      '500':
        description: '"failed to create label".'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }

/api/labels/{id}:
  get:
    operationId: getLabel
    summary: Get a label
    description: server/internal/handler/label.go:166-190 (`GetLabel`).
    tags: [Labels]
    security: *workspaceAuth
    parameters:
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LabelResponse' }
      '404':
        description: Label not found in this workspace.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "label not found" }
      '500':
        description: '"failed to get label".'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
  put:
    operationId: updateLabel
    summary: Update a label
    description: >-
      server/internal/handler/label.go:240-307 (`UpdateLabel`). All body
      fields optional. No role gate. The UPDATE statement itself scopes by
      (id, workspace_id) and a zero-row result is reported as 404 directly
      (no separate precheck, closing a TOCTOU window).
    tags: [Labels]
    security: *workspaceAuth
    parameters:
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/UpdateLabelRequest' }
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LabelResponse' }
      '400':
        description: Invalid body, invalid name, or invalid color.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            examples:
              invalidBody: { value: { error: "invalid request body" } }
              name: { value: { error: "name is required" } }
              color: { value: { error: "color must be a 6-digit hex value like #3b82f6" } }
      '404':
        description: Label not found in this workspace.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "label not found" }
      '409':
        description: Renaming to a name already in use.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
