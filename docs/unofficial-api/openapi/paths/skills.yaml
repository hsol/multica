/api/skills/{id}/files:
  get:
    operationId: listSkillFiles
    summary: List a skill's supporting files
    description: >-
      server/internal/handler/skill.go:2479-2515 (`ListSkillFiles`). Files
      are stored and returned as inline text (no separate blob/upload
      storage). No role gate beyond workspace membership.
    tags: [skills]
    security: *skillsAuth
    parameters:
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: include
        in: query
        schema: { type: string, enum: [content, metadata] }
        description: >-
          `content` (the default) returns each file's full body.
          `metadata` returns path/size/content-hash only, no bodies — same
          `resolveSkillInclude` rule as GET /api/skills/{id}.
    responses:
      '200':
        description: OK — array shape selected by `include` (see parameter description).
        content:
          application/json:
            schema:
              oneOf:
                - type: array
                  items: { $ref: '#/components/schemas/SkillFileResponse' }
                - type: array
                  items: { $ref: '#/components/schemas/SkillFileMetadataResponse' }
      '400':
        description: Workspace-scope middleware cases; an invalid `include`; or an invalid `{id}`.
        content:
          application/json:
            schema: *wsBadRequestSchema
            examples:
              missing: *wsMissingExample
              invalid: *wsInvalidWorkspaceExample
              badInclude: { value: { error: "invalid include: expected \"content\" or \"metadata\"" } }
              invalidId: { value: { error: "invalid skill id" } }
      '401':
        description: *wsUnauthorizedDesc
        content:
          application/json:
            schema: *wsUnauthorizedSchema
            example: *wsUnauthorizedExample
      '403':
        description: *wsTaskTokenForbiddenDesc
        content:
          application/json:
            schema: *wsTaskTokenForbiddenSchema
            example: *wsTaskTokenForbiddenExample
      '404':
        description: Workspace not found/not a member, or `{id}` not found in this workspace.
        content:
          application/json:
            schema: *wsNotFoundSchema
            examples:
              workspace: { value: *wsNotFoundExample }
              skill: { value: { error: "skill not found" } }
      '500':
        description: '"failed to list skill files".'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "failed to list skill files" }
  put:
    operationId: upsertSkillFile
    summary: Create or replace a single skill file
    description: >-
      server/internal/handler/skill.go:2517-2553 (`UpsertSkillFile`).
      Requires `canManageSkill`. Upserts exactly one file by `path`
      (insert, or overwrite if a file at that path already exists) — unlike
      PUT /api/skills/{id} with a `files` array, this does NOT touch any
      other existing file.
    tags: [skills]
    security: *skillsAuth
    parameters:
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateSkillFileRequest'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillFileResponse'
      '400':
        description: >-
          Workspace-scope middleware cases; an invalid `{id}`; body decode
          failure; an invalid `path`; or `path` is (case-insensitively)
          `SKILL.md`, which this single-file endpoint rejects outright
          rather than silently dropping (contrast with POST/PUT on the
          skill itself, which silently drops a `SKILL.md` entry from
          `files[]` instead of erroring).
        content:
          application/json:
            schema: *wsBadRequestSchema
            examples:
              missing: *wsMissingExample
              invalid: *wsInvalidWorkspaceExample
              invalidId: { value: { error: "invalid skill id" } }
              invalidBody: { value: { error: "invalid request body" } }
              invalidPath: { value: { error: "invalid file path" } }
              reservedPath: { value: { error: "SKILL.md is reserved for the primary skill content" } }
      '401':
        description: *wsUnauthorizedDesc
        content:
          application/json:
            schema: *wsUnauthorizedSchema
            example: *wsUnauthorizedExample
      '403':
        description: Workspace-scope task-token case, or caller is neither the skill's creator nor a workspace owner/admin.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            examples:
              taskToken: { value: *wsTaskTokenForbiddenExample }
              notManager: { value: { error: "only the skill creator can manage this skill" } }
      '404':
        description: Workspace not found/not a member, or `{id}` not found in this workspace.
        content:
          application/json:
            schema: *wsNotFoundSchema
            examples:
              workspace: { value: *wsNotFoundExample }
              skill: { value: { error: "skill not found" } }
      '500':
        description: '"failed to upsert skill file: <err>".'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "failed to upsert skill file: ..." }

/api/skills/{id}/files/{fileId}:
  delete:
    operationId: deleteSkillFile
    summary: Delete a single skill file
    description: >-
      server/internal/handler/skill.go:2555-2582 (`DeleteSkillFile`).
      Requires `canManageSkill`. Verifies `{fileId}` actually belongs to
      `{id}` before deleting — a `{fileId}` that exists but belongs to a
      different skill is reported as not-found, not forbidden (deliberate
      information hiding, matching the same pattern used for attachments
      elsewhere in this API).
    tags: [skills]
    security: *skillsAuth
    parameters:
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: fileId
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      '204':
        description: Deleted — no body.
      '400':
        description: Workspace-scope middleware cases; an invalid `{id}`; or `{fileId}` not a parseable UUID.
        content:
          application/json:
            schema: *wsBadRequestSchema
            examples:
              missing: *wsMissingExample
              invalid: *wsInvalidWorkspaceExample
              invalidId: { value: { error: "invalid skill id" } }
              invalidFileId: { value: { error: "invalid file id" } }
      '401':
        description: *wsUnauthorizedDesc
        content:
          application/json:
            schema: *wsUnauthorizedSchema
            example: *wsUnauthorizedExample
      '403':
        description: Workspace-scope task-token case, or caller is neither the skill's creator nor a workspace owner/admin.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            examples:
              taskToken: { value: *wsTaskTokenForbiddenExample }
              notManager: { value: { error: "only the skill creator can manage this skill" } }
      '404':
        description: >-
          Workspace not found/not a member; `{id}` not found in this
          workspace; or `{fileId}` doesn't exist, or exists but belongs to a
          different skill (same "skill file not found" message for both —
          see description).
        content:
          application/json:
            schema: *wsNotFoundSchema
            examples:
              workspace: { value: *wsNotFoundExample }
              skill: { value: { error: "skill not found" } }
              file: { value: { error: "skill file not found" } }
      '500':
        description: '"failed to delete skill file".'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "failed to delete skill file" }
