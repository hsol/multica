  patch:
    operationId: updateChatSession
    tags: [Chat]
    summary: Rename a chat session, or change its project context
    description: >-
      Exactly one of `title` or `project_id` must be supplied — the handler
      400s if both or neither are present (hasTitle == hasProjectID check).
      `project_id` uses a tri-state encoding: absent (field not sent at all)
      means "not this update", JSON `null` clears the project, and a string
      sets it. Setting a non-null project_id re-locks that project the same
      way createChatSession does (#5219), inside its own transaction.
      Status and pinned state have their own dedicated endpoints; agent,
      creator and workspace are immutable.
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - CloudNodePAT: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            description: >-
              Exactly one of `title` / `project_id` must be present in the
              JSON body (checked by presence, not by value — an explicit
              `"title": null` still counts as "title present" for this check
              since Go's json.RawMessage / *string presence is what the
              handler tests, not nullness; sending a null title then fails the
              later "title is required" trim check with 400).
            properties:
              title:
                type: ["string", "null"]
                description: New title. Trimmed; empty after trim is rejected, as is >200 runes.
              project_id:
                description: >-
                  JSON `null` clears the project; a UUID string sets it. Omit
                  this field entirely when updating `title` instead.
                type: ["string", "null"]
                format: uuid
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: object
              description: server/internal/handler/chat.go ChatSessionResponse
              required: [id, workspace_id, agent_id, creator_id, project_id, title, status, has_unread, unread_count, last_message, pinned, created_at, updated_at]
              properties:
                id:
                  type: string
                  format: uuid
                workspace_id:
                  type: string
                  format: uuid
                agent_id:
                  type: string
                  format: uuid
                creator_id:
                  type: string
                  format: uuid
                project_id:
                  type: ["string", "null"]
                  format: uuid
                title:
                  type: string
                status:
                  type: string
                  enum: [active, archived]
                has_unread:
                  type: boolean
                  description: Only populated by list endpoints; single-session fetches return false.
                unread_count:
                  type: integer
                  description: Only populated by list endpoints; single-session fetches return 0.
                last_message:
                  type: ["object", "null"]
                  description: nil when the session has no (visible) messages yet.
                  properties:
                    content:
                      type: string
                    role:
                      type: string
                    created_at:
                      type: string
                      format: date-time
                    failure_reason:
                      type: ["string", "null"]
                    message_kind:
                      type: string
                      enum: [message, no_response]
                pinned:
                  type: boolean
                channel_source:
                  type: object
                  description: Present only for sessions created from an external channel.
                  properties:
                    channel_type:
                      type: string
                    installation_id:
                      type: string
                      format: uuid
                    route_revision:
                      type: integer
                      format: int64
                is_current_channel_route:
                  type: boolean
                  description: >-
                    Distinguishes the active channel route generation from an older
                    Chat that remains readable/writable but is no longer the live
                    route for its channel.
                created_at:
                  type: string
                  format: date-time
                updated_at:
                  type: string
                  format: date-time
      '400':
        description: >-
          invalid request body / exactly one of title or project_id is
          required / invalid chat session id / invalid workspace id / title
          is required (empty after trim) / title is too long (>200 runes) /
          project_id must be a UUID or null / invalid project_id
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '401':
        description: user not authenticated
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '403':
        description: not your chat session / you do not have access to this agent
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '404':
        description: chat session not found / agent not found / project not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '500':
        description: >-
          failed to update chat session / failed to start transaction /
          failed to lock project
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
  delete:
    operationId: deleteChatSession
    tags: [Chat]
    summary: Hard-delete a chat session owned by the caller
    description: >-
      Irreversible (the reversible sibling is archive/unarchive). Runs inside
      a transaction that row-locks the session (blocking a concurrent
      SendChatMessage's INSERT via FK validation), cancels every in-flight
      task for it, and prunes every no-FK dependent row
      (channel_chat_session_binding, channel_outbound_card_message,
      chat_draft_restore, agent_builder_draft) before deleting the session
      itself and its single-session system agent. Idempotent: a session
      already gone (LockChatSessionForDelete finds no row) returns 204 rather
      than 404.
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - CloudNodePAT: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '204':
        description: >-
          Deleted (or already gone — this endpoint is idempotent on a
          missing session, unlike most others which loadChatSessionForUser
          first and would 404 there instead).
      '400':
        description: invalid chat session id / invalid workspace id
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '401':
        description: user not authenticated
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '403':
        description: not your chat session
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '404':
        description: chat session not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '500':
        description: >-
          failed to start transaction / failed to lock chat session / failed
          to lock chat agent / failed to cancel chat session tasks / failed to
          settle terminal task state / failed to delete chat session binding /
          failed to delete chat session outbound cards / failed to delete chat
          session draft restores / failed to delete agent builder draft /
          failed to delete chat session / failed to remove chat session agent
