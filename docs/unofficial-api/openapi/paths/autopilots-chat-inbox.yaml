                        type: string
                        format: uuid
                      role:
                        type: string
                        enum: [user, assistant]
                      content:
                        type: string
                      task_id:
                        type: ["string", "null"]
                        format: uuid
                      created_at:
                        type: string
                        format: date-time
                      failure_reason:
                        type: ["string", "null"]
                        description: Set on an assistant row synthesized by FailTask's chat fallback.
                      elapsed_ms:
                        type: ["integer", "null"]
                        format: int64
                        description: Wall-clock duration from task creation to terminal state.
                      message_kind:
                        type: string
                        enum: [message, no_response, onboarding_kickoff, onboarding_opening]
                        description: >-
                          onboarding_kickoff rows are filtered out of both message-list
                          endpoints before this response is built (visibleChatMessages), so
                          in practice this field never actually carries that value on
                          either listing endpoint — kept in the enum because the wire type
                          is shared with other internal representations.
                      quick_actions:
                        type: array
                        description: Always `[]` for legacy rows and user messages; capped at 3 entries.
                        items:
                          type: object
                          required: [label, prompt]
                          properties:
                            label:
                              type: string
                            prompt:
                              type: string
                            primary:
                              type: boolean
                      attachments:
                        type: array
                        items:
                          type: object
                          description: server/internal/handler/file.go AttachmentResponse
                          required: [id, workspace_id, issue_id, comment_id, chat_session_id, chat_message_id, uploader_type, uploader_id, filename, url, download_url, markdown_url, content_type, size_bytes, created_at]
                          properties:
                            id:
                              type: string
                              format: uuid
                            workspace_id:
                              type: string
                              format: uuid
                            issue_id:
                              type: ["string", "null"]
                              format: uuid
                            comment_id:
                              type: ["string", "null"]
                              format: uuid
                            chat_session_id:
                              type: ["string", "null"]
                              format: uuid
                            chat_message_id:
                              type: ["string", "null"]
                              format: uuid
                            uploader_type:
                              type: string
                            uploader_id:
                              type: string
                              format: uuid
                            filename:
                              type: string
                            url:
                              type: string
                              description: Raw storage object URL; may be private/signed/site-relative.
                            download_url:
                              type: string
                              description: >-
                                URL to use for THIS response's render; may be short-lived
                                (signed) and must not be persisted.
                            attachment_download_url:
                              type: string
                              description: >-
                                Credential-free forced-download URL. Only emitted by the
                                single-attachment endpoint (outside this domain), never in list
                                responses such as these — so always absent here.
                            markdown_url:
                              type: string
                              description: Durable, persistable URL safe to embed in markdown bodies.
                            content_type:
                              type: string
                            size_bytes:
