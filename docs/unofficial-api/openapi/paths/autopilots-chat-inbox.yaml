/api/chat/sessions/{sessionId}/queued-tasks/{taskId}/prioritize:
  post:
    operationId: prioritizeQueuedChatTask
    tags: [Chat]
    summary: Move one queued follow-up ahead of its FIFO peers
    description: >-
      Server-authoritative: locks the session's agent row (the same lock
      ClaimTask takes) before the compare-and-set reorder, so "prioritize +
      report the active task" is one decision rather than a client racing the
      daemon. No request body. The client is expected to follow this call
      with a separate cancel of the current active task through the existing
      cancellation endpoint (POST /api/tasks/{taskId}/cancel, out of this
      domain's scope) to actually make room — this endpoint only reorders the
      queue and reports which task is currently active.
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - CloudNodePAT: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Reordered.
        content:
          application/json:
            schema:
              type: object
              required: [task_id]
              properties:
                task_id:
                  type: string
                  format: uuid
                active_task_id:
                  type: string
                  format: uuid
                  description: The task currently active for this session, if any.
      '400':
        description: invalid chat session id / invalid workspace id / invalid task id
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '401':
        description: user not authenticated
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '403':
        description: not your chat session / you do not have access to this agent
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '404':
        description: chat session not found / agent not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '409':
        description: >-
          "there is no active reply to replace" (the task is still queued for
          this session but there is no claimed reply for it to replace), OR
          "task is no longer queued" (stale / wrong-session / any other
          compare-and-set rejection)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '500':
        description: >-
          failed to start prioritize transaction / failed to lock chat agent /
          failed to load queued task / failed to prioritize queued task /
          failed to load prioritized task / failed to commit queued task
          priority
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

