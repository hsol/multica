/api/notification-preferences:
  get:
    operationId: getNotificationPreferences
    summary: Get the authenticated member's notification preferences for the active workspace
    description: >-
      Reads by `(workspace_id, user_id)`. If no row exists yet (pgx.ErrNoRows),
      returns 200 with an empty `preferences: {}` object rather than 404 —
      "no row yet" and "explicit empty preferences" are not distinguished on
      the wire.
    tags: [NotificationPreferences]
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - CloudNodePAT: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
    responses:
      '200':
        description: Current preferences (possibly empty).
        content:
          application/json:
            schema:
              type: object
              required: [workspace_id, preferences]
              properties:
                workspace_id: { type: string, format: uuid }
                preferences:
                  type: object
                  description: >-
                    Map of preference group key -> value. Keys are a subset of
                    {assignments, status_changes, comments, mentions, updates,
                    agent_activity, system_notifications}; values are
                    "all" or "muted".
                  additionalProperties: { type: string, enum: [all, muted] }
      '401':
        description: Not authenticated.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
      '500':
        description: '`failed to get notification preferences` (non-ErrNoRows query failure).'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
  patch:
    operationId: patchNotificationPreferences
    summary: Merge-update the authenticated member's notification preferences (partial)
    description: >-
      PatchNotificationPreferences atomically merges ONLY the supplied keys
      (PatchNotificationPreference query) — keys not present in the request
      body are left as previously stored, so a stale tab/device cannot wipe
      unrelated mute settings by resubmitting an outdated full snapshot. The
      REQUEST BODY SHAPE is identical to PUT's (same
      `decodeNotificationPreferenceRequest`, same group/value validation) —
      PATCH and PUT are distinguished purely by which query the handler calls
      (merge vs full replace), not by any difference in the accepted body.
    tags: [NotificationPreferences]
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - CloudNodePAT: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [preferences]
            properties:
              preferences:
                type: object
                description: >-
                  Keys to merge in; each key must be one of the 7 valid
                  group names and each value must be "all" or "muted", or
                  the whole request is rejected with 400. An empty object
                  `{}` is accepted (valid, a no-op merge) since only
                  `nil`/absent `preferences` is rejected.
                additionalProperties: { type: string, enum: [all, muted] }
          example:
            preferences:
              comments: muted
    responses:
      '200':
        description: Preferences after the merge.
        content:
          application/json:
            schema:
              type: object
              required: [workspace_id, preferences]
              properties:
                workspace_id: { type: string, format: uuid }
                preferences:
                  type: object
                  additionalProperties: { type: string, enum: [all, muted] }
      '400':
        description: >-
          `invalid request body` (bad JSON); `preferences field is required`
          (nil/absent `preferences`); `invalid preference group: <key>`;
          `invalid preference value: <value>`.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
      '401':
        description: Not authenticated.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
      '500':
        description: >-
          `failed to marshal preferences` (re-marshal of the validated map;
          not expected to occur in practice), or `failed to update
          notification preferences` (PatchNotificationPreference query
          failure).
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
  put:
    operationId: updateNotificationPreferences
    summary: Replace the authenticated member's notification preferences (full)
    description: >-
      UpdateNotificationPreferences preserves the original replace-all PUT
      contract for compatibility with installed clients (per the handler doc
      comment): UpsertNotificationPreference stores the submitted
      `preferences` map as the complete new value, so any previously-stored
      group key NOT present in this request body is dropped, not merged. The
      REQUEST BODY SHAPE is identical to PATCH's — same validation, same
      required `preferences` field; only the server-side replace-vs-merge
      behavior differs.
    tags: [NotificationPreferences]
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - CloudNodePAT: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [preferences]
            properties:
              preferences:
                type: object
                description: >-
                  The COMPLETE new preferences map; any group key omitted
                  here is cleared (not merely left alone) in the stored
                  value. Same group/value validation as PATCH.
                additionalProperties: { type: string, enum: [all, muted] }
          example:
            preferences:
              assignments: all
              status_changes: all
              comments: muted
              mentions: all
              updates: all
              agent_activity: muted
              system_notifications: all
    responses:
      '200':
        description: Preferences after the full replace.
        content:
          application/json:
            schema:
              type: object
              required: [workspace_id, preferences]
              properties:
                workspace_id: { type: string, format: uuid }
                preferences:
                  type: object
                  additionalProperties: { type: string, enum: [all, muted] }
      '400':
        description: >-
          `invalid request body`; `preferences field is required`; `invalid
          preference group: <key>`; `invalid preference value: <value>`.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
      '401':
        description: Not authenticated.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
      '500':
        description: >-
          `failed to marshal preferences`, or `failed to update notification
          preferences` (UpsertNotificationPreference query failure).
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
