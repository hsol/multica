            schema:
              $ref: '#/components/schemas/Error'

/api/chat/sessions/{sessionId}/onboarding:
  post:
    operationId: startMikaOnboarding
    tags: [Chat]
    summary: Open an otherwise-empty Mika chat with a personalized, server-authored greeting
    description: >-
      Narrow, Mika-only (`agent.system_key` must equal the built-in Mika
      system key — gated on system_key, not display name, so a workspace
      rename of Mika cannot 400 this). No agent run happens here: the opening
      is built from a fixed template (buildMikaOnboardingOpening) plus the
      member's onboarding-questionnaire answers, written directly as the
      session's first assistant message, with a second HIDDEN kickoff row
      that carries the onboarding skill + profile block into the member's
      first REAL turn later (MUL-5827). Idempotent along two independent
      paths, both of which return 200 `{started: false}` rather than erroring:
      (1) a fast pre-check (ChatSessionHasUserMessage) when the member has
      already sent a real message, and (2) the service-layer
      ErrChatSessionAlreadyStarted race-safe check taken under the session
      lock. A genuinely new opening returns 201.
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - CloudNodePAT: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [language]
            properties:
              language:
                type: string
                enum: [en, zh, ko, ja]
    responses:
      '200':
        description: >-
          Already started (idempotent no-op) — `started: false`, no
          message_id/created_at.
        content:
          application/json:
            schema:
              type: object
              required: [started]
              properties:
                started:
                  type: boolean
                  enum: [false]
      '201':
        description: Opening written.
        content:
          application/json:
            schema:
              type: object
              required: [started]
              properties:
                started:
                  type: boolean
                  enum: [true]
                message_id:
                  type: string
                  format: uuid
                created_at:
                  type: string
                  format: date-time
      '400':
        description: >-
          invalid request body / language must be en, zh, ko, or ja / chat
          session is archived / onboarding can only be started with the
          workspace's built-in agent (system_key mismatch)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '401':
        description: user not authenticated
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '403':
        description: >-
          not your chat session, OR the structured dispatch-blocked body
          (reason_code=invocation_not_allowed) when the INVOKE permission does
          not hold
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/Error'
                - type: object
                  description: >-
                    server/internal/handler/admission.go dispatchBlockedResponse, written
                    by writeDispatchBlocked. NOT the shared ErrorCode schema — field name
                    is `reason_code`, not `code`, and the enum is dispatch.ReasonCode (a
                    separate, cross-layer vocabulary), not the writeErrorCode `code` enum.
                  required: [error, reason_code]
                  properties:
                    error:
                      type: string
                      description: >-
                        Generic, non-enumerating English fallback message, fixed per
                        reason_code by dispatchBlockedFallbackMessage.
                    reason_code:
                      type: string
                      description: >-
                        Full dispatch.ReasonCode vocabulary (server/internal/dispatch/reason.go).
                        Only a subset is actually reachable from this domain's operations
                        (invocation_not_allowed from canInvokeAgent; agent_runtime_required,
                        runtime_access_denied, runtime_unusable, runtime_profile_missing
                        from AgentReadiness on sendChatMessage) — the enum below lists the
                        full type for forward-compatibility since clients are required to
                        default-branch on an unknown value, not the narrower reachable
                        subset.
                      enum:
                        - queued
                        - coalesced
                        - deferred
                        - steered
                        - invocation_not_allowed
                        - target_unavailable
                        - runtime_offline
                        - runtime_unusable
                        - runtime_access_denied
                        - runtime_profile_missing
                        - agent_runtime_required
                        - attribution_blocked
                        - already_active
                        - self_trigger_suppressed
                        - issue_in_triage
                        - quota_exceeded
                        - issue_limit_reached
                        - internal_error
      '404':
        description: chat session not found / agent not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '409':
        description: chat agent is archived / chat agent has no runtime
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '500':
        description: >-
          failed to load chat agent / failed to load onboarding context
          (GetUser) / failed to load workspace context (GetWorkspace) / failed
          to start Mika onboarding (generic fallback, message includes the
          underlying error)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/api/chat/sessions/{sessionId}/quick-actions/regenerate:
  post:
    operationId: regenerateChatQuickActions
    tags: [Chat]
    summary: Re-run the quick-actions suggestion pass for the session's latest assistant turn
    description: >-
      User-triggered "refresh" button (MUL-5149). Generation itself runs
      server-side and is NOT an agent run, but it still clears the same
      INVOKE gate as a send, since it is a user-triggered spend against the
      agent's conversation. The request names the assistant turn being
      refreshed (message_id); the server 409s if that is no longer the
      session's latest turn (a newer reply already arrived) or if a turn is
      currently running. Detached: answers 202 immediately, delivers the
      refreshed pills asynchronously over the chat:quick_actions realtime
      event, not in this response body.
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - CloudNodePAT: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [message_id]
            properties:
              message_id:
                type: string
                format: uuid
                description: The assistant message whose quick actions are being refreshed.
    responses:
      '202':
        description: Accepted — refreshed pills arrive later over chat:quick_actions.
        content:
          application/json:
            schema:
              type: object
              required: [message_id]
              properties:
                message_id:
                  type: string
                  format: uuid
      '400':
        description: >-
          chat session is archived / invalid request body / invalid message_id
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '401':
        description: user not authenticated
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '403':
        description: >-
          not your chat session, OR a plain Error with code
          "suggestions_not_available" (writeFeatureDisabled, always 403 —
          service.ErrChatQuickActionsUnavailable), OR the structured
          dispatch-blocked body (reason_code=invocation_not_allowed) when the
          INVOKE permission does not hold
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ErrorCode'
                - $ref: '#/components/schemas/Error'
                - type: object
                  description: >-
                    server/internal/handler/admission.go dispatchBlockedResponse, written
                    by writeDispatchBlocked. NOT the shared ErrorCode schema — field name
                    is `reason_code`, not `code`, and the enum is dispatch.ReasonCode (a
                    separate, cross-layer vocabulary), not the writeErrorCode `code` enum.
                  required: [error, reason_code]
                  properties:
                    error:
                      type: string
                      description: >-
                        Generic, non-enumerating English fallback message, fixed per
                        reason_code by dispatchBlockedFallbackMessage.
                    reason_code:
                      type: string
                      description: >-
                        Full dispatch.ReasonCode vocabulary (server/internal/dispatch/reason.go).
                        Only a subset is actually reachable from this domain's operations
                        (invocation_not_allowed from canInvokeAgent; agent_runtime_required,
                        runtime_access_denied, runtime_unusable, runtime_profile_missing
                        from AgentReadiness on sendChatMessage) — the enum below lists the
                        full type for forward-compatibility since clients are required to
                        default-branch on an unknown value, not the narrower reachable
                        subset.
                      enum:
                        - queued
                        - coalesced
                        - deferred
                        - steered
                        - invocation_not_allowed
                        - target_unavailable
                        - runtime_offline
                        - runtime_unusable
                        - runtime_access_denied
                        - runtime_profile_missing
                        - agent_runtime_required
                        - attribution_blocked
                        - already_active
                        - self_trigger_suppressed
                        - issue_in_triage
                        - quota_exceeded
                        - issue_limit_reached
                        - internal_error
      '404':
        description: chat session not found / agent not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '409':
        description: >-
          chat agent is archived, OR "a newer reply arrived — refresh it
          instead" (service.ErrChatQuickActionsStale), OR "still working —
          try refreshing in a moment" (service.ErrChatQuickActionsBusy), OR
          "no assistant reply to refresh yet" (service.ErrChatQuickActionsNoTurn)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '500':
        description: failed to load chat agent / failed to regenerate quick actions (generic fallback)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/api/chat/sessions/{sessionId}/pending-task:
  get:
    operationId: getPendingChatTask
    tags: [Chat]
    summary: Get the session's current in-flight task plus its ordered queued follow-ups
    description: >-
      Root-level fields (task_id/status/created_at/wait_reason) describe only
      the HEAD task, preserved in this shape for older clients recovering a
      single pending task after refresh/reopen; `queued_tasks` is additive and
      lists every later queued follow-up (status == 'queued' only — a
      follow-up that advanced past queued is omitted here, not because it
      isn't still "after" the head, but because listing it as queued would be
      wrong). Returns an all-empty 200 body (just `supports_queue: true`) when
      there is no pending task at all, not a 404.
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - CloudNodePAT: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: OK — empty object (bar supports_queue) when nothing is pending.
        content:
          application/json:
            schema:
              type: object
              required: [supports_queue]
              properties:
                task_id:
                  type: string
                  format: uuid
                status:
                  type: string
                created_at:
                  type: string
                  format: date-time
                wait_reason:
                  type: string
                  description: >-
                    Only ever populated when status is 'waiting_local_directory'
                    — the stored hold text is gated on the status it
                    describes so it never reads as a live explanation for a
                    task that has since resumed.
                supports_queue:
                  type: boolean
                queued_tasks:
                  type: array
                  items:
                    type: object
                    required: [task_id, status, created_at]
                    properties:
                      task_id:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum: [queued]
                      created_at:
                        type: string
                        format: date-time
                      message_id:
                        type: string
                        format: uuid
                      content:
                        type: string
      '400':
        description: invalid chat session id / invalid workspace id
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '401':
        description: user not authenticated
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '403':
        description: not your chat session / you do not have access to this agent
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '404':
        description: chat session not found / agent not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '500':
        description: failed to list pending chat tasks
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

