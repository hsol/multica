  delete:
    operationId: clearQueuedChatTasks
    tags: [Chat]
    summary: Cancel every queued follow-up task for a session
    description: >-
      Leaves the session's current positional head alone (even if that head
      is not claimed yet) — only follow-ups behind it are cancelled.
