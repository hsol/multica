/api/chat/sessions:
  post:
    operationId: createChatSession
    tags: [Chat]
    summary: Create a chat session with an agent
    description: >-
      Gated by the INVOKE permission (canInvokeAgent), not the softer view
      gate — starting a chat produces agent runs. Runs inside a transaction
      that takes a FOR KEY SHARE lock on the workspace row (and, if
      project_id is set, on the project row) so a session cannot be created
      into a workspace/project whose delete is in progress (#5219).
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - CloudNodePAT: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [agent_id]
            properties:
              agent_id:
                type: string
                format: uuid
              title:
                type: string
              project_id:
                type: ["string", "null"]
                format: uuid
    responses:
      '201':
        description: Created.
        content:
          application/json:
            schema:
              type: object
              description: server/internal/handler/chat.go ChatSessionResponse
              required: [id, workspace_id, agent_id, creator_id, project_id, title, status, has_unread, unread_count, last_message, pinned, created_at, updated_at]
              properties:
                id:
                  type: string
                  format: uuid
                workspace_id:
                  type: string
                  format: uuid
                agent_id:
                  type: string
                  format: uuid
                creator_id:
                  type: string
                  format: uuid
                project_id:
                  type: ["string", "null"]
                  format: uuid
                title:
                  type: string
                status:
                  type: string
                  enum: [active, archived]
                has_unread:
                  type: boolean
                  description: Only populated by list endpoints; single-session fetches return false.
                unread_count:
                  type: integer
                  description: Only populated by list endpoints; single-session fetches return 0.
                last_message:
                  type: ["object", "null"]
                  description: nil when the session has no (visible) messages yet.
                  properties:
                    content:
                      type: string
                    role:
                      type: string
                    created_at:
                      type: string
                      format: date-time
                    failure_reason:
                      type: ["string", "null"]
                    message_kind:
                      type: string
                      enum: [message, no_response]
                pinned:
                  type: boolean
                channel_source:
                  type: object
                  description: Present only for sessions created from an external channel.
                  properties:
                    channel_type:
                      type: string
                    installation_id:
                      type: string
                      format: uuid
                    route_revision:
                      type: integer
                      format: int64
                is_current_channel_route:
                  type: boolean
                  description: >-
                    Distinguishes the active channel route generation from an older
                    Chat that remains readable/writable but is no longer the live
                    route for its channel.
                created_at:
                  type: string
                  format: date-time
                updated_at:
                  type: string
                  format: date-time
      '400':
        description: >-
          invalid request body / agent_id is required / invalid agent_id /
          invalid workspace id / invalid project_id / agent is archived
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '401':
        description: user not authenticated
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '403':
        description: you do not have access to this agent (canInvokeAgent false)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '404':
        description: agent not found / workspace not found / project not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '500':
        description: >-
          failed to start transaction / failed to lock workspace / failed to
          lock project / failed to create chat session / failed to mark chat
          session explicit / failed to commit chat session create
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
  get:
