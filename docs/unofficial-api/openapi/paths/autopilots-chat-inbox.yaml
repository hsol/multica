      issue status catalog) and its own distinct failure mode before the
      archive write itself. Returns a count, emits `EventInboxBatchArchived`.
    tags: [Inbox]
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - CloudNodePAT: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
    responses:
      '200':
        description: Count of items archived.
        content:
          application/json:
            schema:
              type: object
              required: [count]
              properties:
                count: { type: integer, format: int64 }
      '400':
        description: Missing/invalid workspace id.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
      '401':
        description: Not authenticated.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
      '500':
        description: '`failed to resolve status categories` (terminalIssueStatusKeys failure), or `failed to archive completed inbox`.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }

/api/inbox/{id}/read:
  post:
    operationId: markInboxRead
    summary: Mark a single inbox item read
    description: >-
      Bodiless. Loads the item via loadInboxItemForUser (requires
      authentication, a resolvable workspace id, and a valid item id that
      exists in that workspace — otherwise 404, scoped by item + workspace
      only, not additionally by recipient in the lookup query itself),
      flips it read, emits `EventInboxRead`, and returns the single updated
      item enriched with `issue_status`/`issue_priority` via a best-effort
      `GetIssue` lookup (left null, not erroring, if that lookup fails).
    tags: [Inbox]
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - CloudNodePAT: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: id
        in: path
        required: true
        description: Inbox item id.
        schema: { type: string, format: uuid }
    responses:
      '200':
        description: The updated inbox item.
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - workspace_id
                - recipient_type
                - recipient_id
                - type
                - severity
                - title
                - read
                - archived
                - created_at
              properties:
                id: { type: string, format: uuid }
                workspace_id: { type: string, format: uuid }
                recipient_type: { type: string }
                recipient_id: { type: string, format: uuid }
                type: { type: string }
                severity: { type: string }
                issue_id: { type: ["string", "null"], format: uuid }
                title: { type: string }
                body: { type: ["string", "null"] }
                read: { type: boolean }
                archived: { type: boolean }
                created_at: { type: string, format: date-time }
                issue_status: { type: ["string", "null"] }
                issue_priority: { type: ["string", "null"] }
                actor_type: { type: ["string", "null"] }
                actor_id: { type: ["string", "null"], format: uuid }
                details: {}
      '400':
        description: '`workspace_id is required`; invalid `inbox item id`; invalid `workspace id`.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
      '401':
        description: Not authenticated.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
      '404':
        description: '`inbox item not found` (wrong id, or not in this workspace).'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
      '500':
        description: '`failed to mark read`.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }

