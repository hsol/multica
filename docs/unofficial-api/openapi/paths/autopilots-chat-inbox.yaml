/api/inbox/archive-completed:
  post:
    operationId: archiveCompletedInbox
    summary: Archive active inbox items whose linked issue is in a terminal status
    description: >-
      Bodiless — ArchiveCompletedInbox takes no request body. Before
      archiving, it resolves the workspace's concrete terminal status keys
      (categories `done` and `closed`, expanded via
      `issuestatus.ExpandCategories`/`terminalIssueStatusKeys`) and only
