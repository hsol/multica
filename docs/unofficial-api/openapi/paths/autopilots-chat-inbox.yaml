/api/chat/sessions/{sessionId}/draft-restores:
  get:
    operationId: listChatDraftRestores
    tags: [Chat]
    summary: List a session's pending deferred-cancellation draft restores
    description: >-
      Part of the #5219 deferred-cancellation protocol: a cancel that settles
      as empty-transcript AFTER the cancel HTTP response already returned
      persists the deleted prompt server-side as a "draft restore" for the
      creator's client to later fetch and reapply. Creator-only via
      loadChatSessionForUser — deliberately NOT the private-agent gate used by
      almost every other session endpoint: the content is the caller's own
      deleted prompt, and losing agent access must never strand it
      server-side forever.
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - CloudNodePAT: []
      - BrowserSession: []
    parameters:
