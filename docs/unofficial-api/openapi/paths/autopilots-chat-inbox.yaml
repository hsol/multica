# Domain: autopilots/chat/inbox/notification-preferences
# Owner: this domain ticket.
# Top-level keys are path strings merged verbatim into the document's
# "paths" object by scripts/merge.mjs — add operations here, not under a
# nested "paths:" key. This file was assembled from four independently
# researched sections (Autopilots core, Autopilot triggers/runs/deliveries,
# Chat, Inbox/Notification Preferences); each section keeps its own
# source-attribution header comment below, unmodified from the research
# pass that produced it.

# Domain: Autopilots (core CRUD + cron-preview + usage + trigger + collaborators)
# Source: server/internal/handler/autopilot.go, server/internal/handler/autopilot_cron_preview.go
# Endpoints NOT covered here (out of this ticket's 10): /api/autopilots/{id}/runs*,
# /api/autopilots/{id}/triggers* (CreateAutopilotTrigger etc.), webhook signing-secret
# endpoint, /api/webhooks/autopilots/{token} public ingress — left for sibling tickets.
#
# Top-level keys are path strings merged verbatim into the document's "paths"
# object by scripts/merge.mjs — do not nest under a "paths:" key, and do not
# add a "components:" key here (it would be merged as a literal path). Every
# domain-specific schema is therefore duplicated inline at each usage site
# rather than $ref'd to a local section, per this ticket's rules.

/api/autopilots:
  get:
    operationId: listAutopilots
    summary: List autopilots in the workspace
    description: >-
      Lists autopilots for the resolved workspace. Confirmed from
      server/internal/handler/autopilot.go:439 (ListAutopilots): this endpoint
      takes NO pagination parameters (no limit/next_cursor — the handler calls
      db.ListAutopilots with only workspace_id and an optional status filter
      and returns every matching row in one response). The `status` query
      param is passed straight through to the SQL filter with no
      allow-list/enum validation at the handler layer — any non-empty string
      is accepted as-is (no 400 is raised for an unrecognized value; it simply
      matches nothing). One of X-Workspace-ID or X-Workspace-Slug must resolve
      a workspace (enforced by the surrounding RequireWorkspaceMember router
      group), per the shared header parameters' own description.
    tags: [Autopilots]
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - CloudNodePAT: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: status
        in: query
        required: false
        description: >-
          Exact-match filter on the autopilot's status column (e.g.
          "active", "archived"). Confirmed: passed through unvalidated
          (autopilot.go:443-449); not a closed enum at this layer.
        schema:
          type: string
    responses:
      '200':
        description: >-
          OK. Confirmed envelope shape — a bare array is NOT returned;
          the handler wraps items under `autopilots` plus a `total` count
          (autopilot.go:520). `trigger_kinds`, `next_run_at`, and
          `last_run_status` are populated here (list-only derived fields);
          `can_write` is populated per row when the caller resolves to a
          workspace member, otherwise omitted (autopilot.go:513-517).
          `can_manage_access` is NOT populated by this endpoint (only by
          GetAutopilot) — not guessed, simply omitted here.
        content:
          application/json:
            schema:
              type: object
              required: [autopilots, total]
              additionalProperties: false
              properties:
                autopilots:
                  type: array
                  items:
                    type: object
                    description: >-
                      AutopilotResponse (list form): includes
                      trigger_kinds/next_run_at/last_run_status/can_write;
                      can_manage_access is never populated here (confirmed).
                    required:
                      - id
                      - workspace_id
                      - title
                      - description
                      - project_id
                      - assignee_type
                      - assignee_id
                      - status
                      - pause_reason
                      - execution_mode
                      - issue_title_template
                      - created_by_type
                      - created_by_id
                      - last_run_at
                      - created_at
                      - updated_at
                      - subscribers
                    additionalProperties: false
                    properties:
                      id: { type: string, format: uuid }
                      workspace_id: { type: string, format: uuid }
                      title: { type: string }
                      description: { type: ["string", "null"] }
                      project_id: { type: ["string", "null"], format: uuid }
                      assignee_type: { type: string, enum: [agent, squad] }
                      assignee_id: { type: string, format: uuid }
                      status:
                        type: string
                        description: 소스에서 확인 불가 - 전체 허용값(enum) 목록. 관측된 값으로 "active", "archived"가 있음.
                      pause_reason: { type: ["string", "null"] }
                      execution_mode: { type: string, enum: [create_issue, run_only] }
                      issue_title_template: { type: ["string", "null"] }
                      created_by_type:
                        type: string
                        description: 이 핸들러에서는 항상 "member"로 생성됨; 다른 생성 경로가 있을 수 있어 닫힌 enum으로 단정하지 않음.
                      created_by_id: { type: string, format: uuid }
                      last_run_at: { type: ["string", "null"], format: date-time }
                      created_at: { type: string, format: date-time }
                      updated_at: { type: string, format: date-time }
                      trigger_kinds:
                        type: array
                        items: { type: string }
                        description: List-endpoint-only; enabled trigger kinds for this autopilot.
                      next_run_at:
                        type: string
                        format: date-time
                        description: List-endpoint-only; present only when a next run is scheduled (omitted otherwise, never emitted as null).
                      last_run_status:
                        type: string
                        description: List-endpoint-only; most recent run's status.
                      subscribers:
                        type: array
                        items:
                          type: object
                          required: [user_type, user_id, created_at]
                          additionalProperties: false
                          properties:
                            user_type:
                              type: string
                              const: member
                              description: Restricted to "member" at the DB layer; kept as a string field on the wire for future additive expansion.
                            user_id: { type: string, format: uuid }
                            created_at: { type: string, format: date-time }
                      can_write:
                        type: boolean
                        description: Present only when the caller resolves to a workspace member.
                total:
                  type: integer
                  description: len(autopilots) for this response (not a total across pages — there is no paging).
      '500':
        description: >-
          Internal error. Confirmed call sites: "failed to list autopilots"
          (autopilot.go:452) and "failed to list autopilot subscribers"
          (autopilot.go:493, fail-closed rather than degrading to an empty list).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

  post:
    operationId: createAutopilot
    summary: Create an autopilot
    description: >-
      Creates an autopilot owned by the acting member (requireAutopilotActingMember,
      autopilot.go:844) — never the authenticated runtime owner when called by an
      agent. Status is always created as "active" (autopilot.go:907); there is no
      way to create it in another status.
    tags: [Autopilots]
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - CloudNodePAT: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            description: CreateAutopilotRequest (autopilot.go:359).
            required: [title, assignee_id, execution_mode]
            additionalProperties: false
            properties:
              title:
                type: string
                description: Required; empty string rejected with 400 (autopilot.go:814).
              description:
                type: ["string", "null"]
              project_id:
                type: ["string", "null"]
                format: uuid
                description: >-
                  When non-null/non-empty, must reference a project in this
                  workspace or 400 is returned (autopilot.go:1333).
              assignee_type:
                type: ["string", "null"]
                enum: [agent, squad, null]
                description: >-
                  Optional; defaults to "agent" when omitted/empty
                  (autopilot.go:859-862). Any other value is a 400.
              assignee_id:
                type: string
                format: uuid
                description: Required (autopilot.go:818); must resolve to a valid, non-archived agent/squad in this workspace.
              execution_mode:
                type: string
                enum: [create_issue, run_only]
                description: Required; any other value is a 400 (autopilot.go:822-828).
              issue_title_template:
                type: ["string", "null"]
                description: Validated by service.ValidateIssueTitleTemplate when non-null (autopilot.go:830-835); invalid template → 400 with that validator's own message.
              subscribers:
                type: array
                description: >-
                  Optional. Each entry's user_type MUST be "member" (DB-layer
                  restriction, enforced at autopilot.go:974) and user_id must
                  be a workspace member or 400 is returned (autopilot.go:1027-1029).
                items:
                  type: object
                  required: [user_type, user_id]
                  additionalProperties: false
                  properties:
                    user_type:
                      type: string
                      const: member
                    user_id:
                      type: string
                      format: uuid
    responses:
      '201':
        description: Created.
        content:
          application/json:
            schema:
              type: object
              description: >-
                AutopilotResponse (detail form, as returned by create/update/get):
                no trigger_kinds/next_run_at/last_run_status (list-only fields).
                can_write/can_manage_access are unset on this create response
                (no caller-write-access resolution happens on this path; the
                fields are simply omitted since both are *bool with omitempty).
              required:
                - id
                - workspace_id
                - title
                - description
                - project_id
                - assignee_type
                - assignee_id
                - status
                - pause_reason
                - execution_mode
                - issue_title_template
                - created_by_type
                - created_by_id
                - last_run_at
                - created_at
                - updated_at
                - subscribers
              additionalProperties: false
              properties:
                id: { type: string, format: uuid }
                workspace_id: { type: string, format: uuid }
                title: { type: string }
                description: { type: ["string", "null"] }
                project_id: { type: ["string", "null"], format: uuid }
                assignee_type: { type: string, enum: [agent, squad] }
                assignee_id: { type: string, format: uuid }
                status:
                  type: string
                  const: active
                  description: Always "active" on create (autopilot.go:907).
                pause_reason: { type: ["string", "null"] }
                execution_mode: { type: string, enum: [create_issue, run_only] }
                issue_title_template: { type: ["string", "null"] }
                created_by_type:
                  type: string
                  const: member
                created_by_id: { type: string, format: uuid }
                last_run_at: { type: ["string", "null"], format: date-time }
                created_at: { type: string, format: date-time }
                updated_at: { type: string, format: date-time }
                subscribers:
                  type: array
                  items:
                    type: object
                    required: [user_type, user_id, created_at]
                    additionalProperties: false
                    properties:
                      user_type: { type: string, const: member }
                      user_id: { type: string, format: uuid }
                      created_at: { type: string, format: date-time }
      '400':
        description: >-
          Confirmed writeError(400, ...) call sites on this path: "invalid
          request body", "title is required", "assignee_id is required",
          "execution_mode is required", "execution_mode must be create_issue
          or run_only", the ValidateIssueTitleTemplate message, invalid
          assignee_id/workspace-id UUID shape, "assignee_type must be agent or
          squad", "project_id must reference a project in this workspace",
          subscriber shape errors (e.g. "subscribers[%d].user_type must be
          'member'", "subscribers[%d].user_id is required"), "subscribers[%d]
          is not a member of this workspace", "assignee must be a valid agent
          in this workspace", "assignee must be a valid squad in this
          workspace", "squad leader agent not found".
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '403':
        description: >-
          No human authorized the create, or the acting human is not a
          workspace member — writeErrorCode via autopilotCreateRefusal
          (autopilot.go:680-685): codes `autopilot_no_originator` or
          `autopilot_actor_not_member`. A distinct plain-Error 403
          ("cannot assign autopilot to squad with private leader",
          autopilot.go:1866) is also possible when assignee_type=squad and
          the acting member cannot invoke the squad's private leader.
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ErrorCode'
                - $ref: '#/components/schemas/Error'
      '422':
        description: >-
          Assignee exists but is not usable: "assignee agent is archived;
          pick a different agent", "assignee agent needs a runtime before
          this autopilot can be active", "squad is archived; pick a
          different squad", "squad leader is archived; pick a different
          squad or rotate the leader before assigning autopilot", "squad
          leader needs a runtime before this autopilot can be active"
          (autopilot.go:1818-1861).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '500':
        description: >-
          "failed to create autopilot" (several call sites across the tx),
          "failed to add autopilot subscriber" (autopilot.go:934).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/api/autopilots/cron-preview:
  get:
    operationId: cronPreview
    summary: Preview the next occurrences of a candidate cron expression
    description: >-
      Compute-only endpoint (autopilot_cron_preview.go, 55 lines total): no
      autopilot or trigger is read or written. Workspace membership is still
      enforced by the router group even though no workspace-scoped resource
      is touched.
    tags: [Autopilots]
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - CloudNodePAT: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: expr
        in: query
        required: true
        description: Cron expression to preview. Empty/missing → 400 invalid_cron (cron_preview.go:27-31).
        schema:
          type: string
      - name: tz
        in: query
        required: false
        description: IANA timezone name. Defaults to "UTC" when omitted/empty (cron_preview.go:32-35); validated via service.ValidateTimezone.
        schema:
          type: string
          default: UTC
    responses:
      '200':
        description: >-
          Up to 3 predicted next occurrences (previewCount = 3,
          cron_preview.go:41), each RFC3339. A syntactically valid
          expression that never fires returns a short/empty array, not an
          error (cron_preview.go:42-44) — "never runs" is distinguished
          from "invalid cron" purely by status code (200 vs 400).
        content:
          application/json:
            schema:
              type: object
              required: [next_runs]
              additionalProperties: false
              properties:
                next_runs:
                  type: array
                  maxItems: 3
                  items:
                    type: string
                    format: date-time
      '400':
        description: >-
          Deviation: this endpoint does NOT use the shared writeErrorCode
          helper — writeCronPreviewError (cron_preview.go:18-20) calls
          writeJSON directly with its own two codes, neither of which is a
          member of the shared ErrorCode schema's `code` enum
          (confirmed absent from docs/unofficial-api/openapi/components/schemas.yaml).
          Modeled inline rather than $ref'd to ErrorCode for that reason.
        content:
          application/json:
            schema:
              type: object
              required: [error, code]
              additionalProperties: false
              properties:
                error:
                  type: string
                code:
                  type: string
                  enum: [invalid_cron, invalid_timezone]

/api/autopilots/usage:
  get:
    operationId: getAutopilotQuotaUsage
    summary: Get the workspace's autopilot dispatch quota usage
    description: >-
      Confirmed from autopilot.go:2438-2469 (GetAutopilotQuotaUsage): no
      query parameters are read by this handler (no `?action=` or similar —
      it resolves only the workspace and delegates to
      h.AutopilotService.AutopilotQuotaUsage). Returns a SINGLE usage object,
      not a list. When the quota gate is disabled, the service still returns
      successfully and the handler answers 200 with `action: "off"` and every
      other field at its zero value / null (autopilot.go:2449-2450) — it does
      not 404 or otherwise signal "disabled" via status code.
    tags: [Autopilots]
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - CloudNodePAT: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              type: object
              description: AutopilotQuotaUsageResponse.
              required: [action, used, reserved, total, limit, reached, period_start, period_end, reset_at, blocked_counts]
              additionalProperties: false
              properties:
                action:
                  type: string
                  description: >-
                    "off" when the quota gate is disabled (autopilot.go:2449);
                    otherwise the service-provided action name
                    (usage.Action) — full value set not re-derived here (defined
                    in AutopilotService, outside this handler file's scope).
                used:
                  type: ["integer", "null"]
                  format: int64
                reserved:
                  type: ["integer", "null"]
                  format: int64
                total:
                  type: ["integer", "null"]
                  format: int64
                limit:
                  type: ["integer", "null"]
                  format: int64
                reached:
                  type: ["boolean", "null"]
                period_start:
                  type: ["string", "null"]
                  format: date-time
                period_end:
                  type: ["string", "null"]
                  format: date-time
                reset_at:
                  type: ["string", "null"]
                  format: date-time
                blocked_counts:
                  type: object
                  description: Map of reason → count. Confirmed non-nullable map type (BlockedCounts map[string]int64, no omitempty/pointer); may be an empty object.
                  additionalProperties:
                    type: integer
                    format: int64
      '400':
        description: '"invalid workspace" when the resolved workspace header value does not parse as a UUID (autopilot.go:2439-2442).'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '500':
        description: '"failed to load autopilot quota usage" (autopilot.go:2446).'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/api/autopilots/{id}:
  get:
    operationId: getAutopilot
    summary: Get an autopilot's detail, including its triggers and collaborators
    description: >-
      Confirmed envelope (autopilot.go:589-593): a single object keyed under
      `autopilot`, plus sibling `triggers` and `collaborators` arrays fetched
      in the same request — not three separate calls. Webhook trigger
      secrets (webhook_token/webhook_path/webhook_url) are redacted on each
      trigger entry unless the resolved caller has write access
      (redactWebhookSecrets, autopilot.go:572-574, MUL-3807/MUL-7108). If the
      triggers or collaborators sub-queries fail, the handler does NOT error
      the whole response — it silently substitutes an empty array for that
      list (autopilot.go:567, 582), unlike the subscribers failure below.
    tags: [Autopilots]
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - CloudNodePAT: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              type: object
              required: [autopilot, triggers, collaborators]
              additionalProperties: false
              properties:
                autopilot:
                  type: object
                  description: >-
                    AutopilotResponse (detail form). can_write AND
                    can_manage_access are both always populated on this
                    endpoint specifically (autopilot.go:561-562).
                  required:
                    - id
                    - workspace_id
                    - title
                    - description
                    - project_id
                    - assignee_type
                    - assignee_id
                    - status
                    - pause_reason
                    - execution_mode
                    - issue_title_template
                    - created_by_type
                    - created_by_id
                    - last_run_at
                    - created_at
                    - updated_at
                    - subscribers
                    - can_write
                    - can_manage_access
                  additionalProperties: false
                  properties:
                    id: { type: string, format: uuid }
                    workspace_id: { type: string, format: uuid }
                    title: { type: string }
                    description: { type: ["string", "null"] }
                    project_id: { type: ["string", "null"], format: uuid }
                    assignee_type: { type: string, enum: [agent, squad] }
                    assignee_id: { type: string, format: uuid }
                    status:
                      type: string
                      description: 소스에서 확인 불가 - 전체 허용값(enum) 목록. 관측된 값으로 "active", "archived"가 있음.
                    pause_reason: { type: ["string", "null"] }
                    execution_mode: { type: string, enum: [create_issue, run_only] }
                    issue_title_template: { type: ["string", "null"] }
                    created_by_type: { type: string }
                    created_by_id: { type: string, format: uuid }
                    last_run_at: { type: ["string", "null"], format: date-time }
                    created_at: { type: string, format: date-time }
                    updated_at: { type: string, format: date-time }
                    subscribers:
                      type: array
                      items:
                        type: object
                        required: [user_type, user_id, created_at]
                        additionalProperties: false
                        properties:
                          user_type: { type: string, const: member }
                          user_id: { type: string, format: uuid }
                          created_at: { type: string, format: date-time }
                    can_write: { type: boolean }
                    can_manage_access: { type: boolean }
                triggers:
                  type: array
                  items:
                    type: object
                    description: AutopilotTriggerResponse.
                    required:
                      - id
                      - autopilot_id
                      - kind
                      - enabled
                      - cron_expression
                      - timezone
                      - next_run_at
                      - webhook_token
                      - webhook_path
                      - webhook_url
                      - provider
                      - has_signing_secret
                      - signing_secret_hint
                      - label
                      - last_fired_at
                      - created_at
                      - updated_at
                    additionalProperties: false
                    properties:
                      id: { type: string, format: uuid }
                      autopilot_id: { type: string, format: uuid }
                      kind:
                        type: string
                        description: 소스에서 확인 불가 - 레거시 "api" 종류 행이 남아있을 수 있어 닫힌 enum으로 단정하지 않음 (신규 생성은 schedule/webhook만 허용).
                      enabled: { type: boolean }
                      cron_expression: { type: ["string", "null"] }
                      timezone: { type: ["string", "null"] }
                      next_run_at: { type: ["string", "null"], format: date-time }
                      webhook_token:
                        type: ["string", "null"]
                        description: Redacted (null) unless the caller has write access to the autopilot.
                      webhook_path:
                        type: ["string", "null"]
                        description: Redacted (null) unless the caller has write access.
                      webhook_url:
                        type: ["string", "null"]
                        description: Null when the server has no MULTICA_PUBLIC_URL configured, OR redacted for a non-writer caller.
                      provider:
                        type: ["string", "null"]
                        enum: [generic, github, null]
                      has_signing_secret: { type: boolean }
                      signing_secret_hint:
                        type: ["string", "null"]
                        description: Last 4 characters of the configured secret; never the secret itself.
                      label: { type: ["string", "null"] }
                      last_fired_at: { type: ["string", "null"], format: date-time }
                      created_at: { type: string, format: date-time }
                      updated_at: { type: string, format: date-time }
                      event_filters:
                        type: array
                        description: 소스에서 확인 불가 - WebhookEventFilter 필드 구조 (이 티켓 범위 밖 파일에 정의됨). 웹훅 트리거에만 존재하며, 비어있으면 전체 이벤트 허용을 의미.
                        items:
                          type: object
                collaborators:
                  type: array
                  items:
                    type: object
                    description: AutopilotCollaboratorEntry.
                    required: [user_type, user_id, granted_by, created_at]
                    additionalProperties: false
                    properties:
                      user_type: { type: string, const: member }
                      user_id: { type: string, format: uuid }
                      granted_by: { type: string, format: uuid }
                      created_at: { type: string, format: date-time }
      '400':
        description: id or the resolved workspace id is not a well-formed UUID (parseUUIDOrBadRequest, autopilot.go:597-604).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '404':
        description: '"autopilot not found" — no row for this id in this workspace (autopilot.go:611).'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '500':
        description: '"failed to list autopilot subscribers" (autopilot.go:537) — fails closed, unlike the triggers/collaborators sub-reads noted above.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

  patch:
    operationId: updateAutopilot
    summary: Update an autopilot
    description: >-
      Partial update with explicit tri-state semantics for description,
      issue_title_template, project_id, and subscribers: the handler
      re-decodes the raw request body into a `map[string]json.RawMessage`
      (autopilot.go:1065-1066) and only applies a field when its key is
      PRESENT in the body — "omitted" and "sent as null" are distinguished
      for those four fields. assignee_type/assignee_id are validated as a
      pair: sending only one when it would change the assignee kind is a
      400 (autopilot.go:1134-1137). title, status, and execution_mode are
      plain optional overwrites (no null-clearing semantics — they are
      non-nullable columns). Status value itself is NOT validated against a
      closed enum anywhere in this handler (confirmed: no switch/allow-list
      on req.Status before it is written, autopilot.go:1078-1080) — the
      complete set of legal status strings could not be confirmed from this
      file; the response's status field is documented as a free string for
      that reason.
    tags: [Autopilots]
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - CloudNodePAT: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            description: UpdateAutopilotRequest (autopilot.go:372). Every field optional; see description above for presence-sensitive fields.
            additionalProperties: false
            properties:
              title:
                type: string
              description:
                type: ["string", "null"]
              project_id:
                type: ["string", "null"]
                format: uuid
              assignee_type:
                type: ["string", "null"]
                enum: [agent, squad, null]
              assignee_id:
                type: ["string", "null"]
                format: uuid
                description: Sending this key with an explicit null is itself a 400 ("assignee_id cannot be null", autopilot.go:1121-1124).
              status:
                type: string
                description: 소스에서 확인 불가 - 전체 허용값 목록 (핸들러 레벨에서 enum 검증 없음). 관측된 값으로 "active", "archived"가 있음.
              execution_mode:
                type: string
                enum: [create_issue, run_only]
              issue_title_template:
                type: ["string", "null"]
              subscribers:
                type: array
                description: Wholesale replacement when the key is present (autopilot.go:382); omit the key entirely to leave subscribers untouched.
                items:
                  type: object
                  required: [user_type, user_id]
                  additionalProperties: false
                  properties:
                    user_type:
                      type: string
                      const: member
                    user_id:
                      type: string
                      format: uuid
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              type: object
              description: AutopilotResponse (detail form). can_write/can_manage_access are unset on this response (not resolved on the update path).
              required:
                - id
                - workspace_id
                - title
                - description
                - project_id
                - assignee_type
                - assignee_id
                - status
                - pause_reason
                - execution_mode
                - issue_title_template
                - created_by_type
                - created_by_id
                - last_run_at
                - created_at
                - updated_at
                - subscribers
              additionalProperties: false
              properties:
                id: { type: string, format: uuid }
                workspace_id: { type: string, format: uuid }
                title: { type: string }
                description: { type: ["string", "null"] }
                project_id: { type: ["string", "null"], format: uuid }
                assignee_type: { type: string, enum: [agent, squad] }
                assignee_id: { type: string, format: uuid }
                status:
                  type: string
                  description: 소스에서 확인 불가 - 전체 허용값(enum) 목록.
                pause_reason: { type: ["string", "null"] }
                execution_mode: { type: string, enum: [create_issue, run_only] }
                issue_title_template: { type: ["string", "null"] }
                created_by_type: { type: string }
                created_by_id: { type: string, format: uuid }
                last_run_at: { type: ["string", "null"], format: date-time }
                created_at: { type: string, format: date-time }
                updated_at: { type: string, format: date-time }
                subscribers:
                  type: array
                  items:
                    type: object
                    required: [user_type, user_id, created_at]
                    additionalProperties: false
                    properties:
                      user_type: { type: string, const: member }
                      user_id: { type: string, format: uuid }
                      created_at: { type: string, format: date-time }
      '400':
        description: >-
          Confirmed writeError(400, ...) sites: "failed to read request
          body", "invalid request body", "assignee_id cannot be null",
          invalid assignee_id UUID shape, "assignee_type must be agent or
          squad", "assignee_id is required when changing assignee_type",
          the ValidateIssueTitleTemplate message, "project_id must
          reference a project in this workspace", subscriber shape errors,
          "subscribers[%d] is not a member of this workspace", "assignee
          must be a valid agent/squad in this workspace", "squad leader
          agent not found".
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '403':
        description: >-
          writeErrorCode via autopilotWriteRefusal (autopilot.go:669-674):
          `autopilot_no_originator` or `autopilot_forbidden`. Also a plain
          403 Error ("cannot assign autopilot to squad with private
          leader") on the private-leader squad path.
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ErrorCode'
                - $ref: '#/components/schemas/Error'
      '404':
        description: '"autopilot not found" — from the initial load (autopilot.go:611) or the re-lock-under-tx read racing a concurrent delete (autopilot.go:1197-1200, pgx.ErrNoRows).'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '409':
        description: >-
          Deviation: optimistic-concurrency conflict, but NOT shaped like
          the shared RevisionConflict/EditConflict schemas — this handler
          writes its own ad hoc body with writeJSON directly
          (autopilot.go:1205-1211), missing resource_type/resource_id/
          expected_revision/actual_revision and using a code
          ("autopilot_update_conflict") that is also absent from the
          shared ErrorCode enum. Modeled inline for that reason.
        content:
          application/json:
            schema:
              type: object
              required: [error, code]
              additionalProperties: false
              properties:
                error:
                  type: string
                  const: the autopilot changed while it was being edited; reload and try again.
                code:
                  type: string
                  const: autopilot_update_conflict
      '422':
        description: Assignee exists but is not usable (archived / missing runtime) — same messages as POST /api/autopilots.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '500':
        description: '"failed to update autopilot" (several call sites), "failed to update subscribers", "failed to add autopilot subscriber".'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

  delete:
    operationId: deleteAutopilot
    summary: Delete (archive) an autopilot
    description: >-
      Deviation: product "delete" is an ARCHIVE, not a destructive delete
      (autopilot.go:1366-1368) — qtx.ArchiveAutopilot flips status to
      "archived" and stops future triggers while preserving runs, tasks,
      webhook deliveries, subscribers, and collaborators as history. There
      is no distinct "undelete" endpoint documented in this ticket's scope.
      Archiving is treated as a substantive rule change, so a new rule
      version is appended atomically with the archive (autopilot.go:1369-1387).
    tags: [Autopilots]
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - CloudNodePAT: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '204':
        description: >-
          No Content. Confirmed: w.WriteHeader(http.StatusNoContent) with no
          body (autopilot.go:1394) — the archived AutopilotResponse is NOT
          returned.
      '400':
        description: id or workspace id is not a well-formed UUID.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '403':
        description: writeErrorCode via autopilotWriteRefusal — `autopilot_no_originator` or `autopilot_forbidden`.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorCode'
      '404':
        description: '"autopilot not found" (autopilot.go:1357).'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '500':
        description: '"failed to delete autopilot" (several call sites across the archive tx, autopilot.go:1373-1390).'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/api/autopilots/{id}/trigger:
  post:
    operationId: triggerAutopilot
    summary: Manually run an autopilot now
    description: >-
      Manual "run now". This endpoint's ONLY write gate is
      requireAutopilotTriggerInvoker (autopilot.go:2350-2363); it does
      deliberately NOT also call requireAutopilotWrite (see the comment at
      autopilot.go:2339-2349, #8099) — both ultimately judge the same
      acting human, so calling both would just require the grant twice.
      Authorization runs BEFORE the autopilot-not-active check, so an
      unauthorized caller cannot distinguish an inactive autopilot from an
      active one via status code alone (autopilot.go:2376-2385). The run is
      attributed source=direct_human to the acting human (never the
      runtime-owner token holder).
    tags: [Autopilots]
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - CloudNodePAT: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - $ref: '#/components/parameters/IdempotencyKeyHeader'
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: >-
          Run dispatched (or admitted-but-skipped — status is reported
          inside the body, this is not itself an error path). `reason_code`
          carries the typed admission/skip reason when one applies
          (autopilot.go:2424-2431); absent on a plain success.
        content:
          application/json:
            schema:
              type: object
              description: AutopilotRunResponse (non-slim — full trigger_payload included).
              required:
                - id
                - autopilot_id
                - trigger_id
                - source
                - status
                - issue_id
                - task_id
                - triggered_at
                - completed_at
                - failure_reason
                - trigger_payload
                - result
                - created_at
              additionalProperties: false
              properties:
                id: { type: string, format: uuid }
                autopilot_id: { type: string, format: uuid }
                trigger_id:
                  type: ["string", "null"]
                  format: uuid
                  description: Null for this endpoint — a manual "run now" has no trigger row.
                source:
                  type: string
                  const: direct_human
                  description: Confirmed constant for this endpoint (autopilot.go:2374).
                status:
                  type: string
                  description: 소스에서 확인 불가 - 전체 허용값(enum) 목록.
                issue_id: { type: ["string", "null"], format: uuid }
                task_id: { type: ["string", "null"], format: uuid }
                triggered_at: { type: string, format: date-time }
                completed_at: { type: ["string", "null"], format: date-time }
                failure_reason: { type: ["string", "null"] }
                reason_code:
                  type: string
                  description: Present only when the dispatch service supplies a typed admission/skip reason (autopilot.go:2428-2431); omitted on a plain run.
                trigger_payload: {}
                result: {}
                created_at: { type: string, format: date-time }
      '400':
        description: >-
          "autopilot is not active" (autopilot.go:2382-2385), "Idempotency-Key
          is too long" (>255 chars, autopilot.go:2387-2391), or a malformed
          id/workspace id.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '403':
        description: writeErrorCode via autopilotTriggerRefusal (autopilot.go:692-697) — `autopilot_trigger_no_originator` or `autopilot_trigger_forbidden`. The same sentence/code is used whether the acting human is a non-member or simply lacks the grant, so this endpoint cannot be used to probe workspace membership (autopilot.go:2356-2361).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorCode'
      '404':
        description: '"autopilot not found".'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '429':
        description: >-
          Deviation: dispatch quota exceeded. Not an Error/ErrorCode shape —
          a dedicated body (autopilot.go:2397-2409) plus a `Retry-After`
          header (seconds, minimum 1). Detected via
          errors.As(err, &service.AutopilotQuotaExceededError).
        headers:
          Retry-After:
            description: Seconds until the quota resets (minimum 1).
            schema:
              type: integer
        content:
          application/json:
            schema:
              type: object
              required: [reason_code, used, reserved, limit, reset_at]
              additionalProperties: false
              properties:
                reason_code:
                  type: string
                  const: quota_exceeded
                used:
                  type: integer
                  format: int64
                reserved:
                  type: integer
                  format: int64
                limit:
                  type: integer
                  format: int64
                reset_at:
                  type: string
                  format: date-time
      '500':
        description: >-
          "failed to trigger autopilot" (autopilot.go:2420) — every
          unclassified dispatch failure collapses to this one fixed
          string; the real error (which may carry pgx constraint/table
          names) is logged server-side only, never returned (MUL-6472).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/api/autopilots/{id}/collaborators:
  post:
    operationId: addAutopilotCollaborator
    summary: Grant a workspace member explicit write access to an autopilot
    description: >-
      Only the autopilot's creator or a workspace owner/admin may grant
      access (requireAutopilotAccessManagement, autopilot.go:796-806,
      MUL-3807) — a collaborator who can write the autopilot cannot re-grant
      access to others. Only workspace members can be granted
      (autopilot.go:1448-1451) — agents already reach autopilots through
      their own dispatch path, not this grant list.
    tags: [Autopilots]
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - CloudNodePAT: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            description: AutopilotCollaboratorRequest (autopilot.go:1399-1401).
            required: [user_id]
            additionalProperties: false
            properties:
              user_id:
                type: string
                format: uuid
                description: Must resolve to a workspace member or 400 is returned (autopilot.go:1448-1451). user_type is fixed to "member" server-side — not a request field.
    responses:
      '201':
        description: Granted. Returns the FULL current collaborator list for this autopilot, not just the new grant (writeAutopilotCollaborators, autopilot.go:1403-1414).
        content:
          application/json:
            schema:
              type: object
              required: [collaborators]
              additionalProperties: false
              properties:
                collaborators:
                  type: array
                  items:
                    type: object
                    description: AutopilotCollaboratorEntry.
                    required: [user_type, user_id, granted_by, created_at]
                    additionalProperties: false
                    properties:
                      user_type: { type: string, const: member }
                      user_id: { type: string, format: uuid }
                      granted_by: { type: string, format: uuid }
                      created_at: { type: string, format: date-time }
      '400':
        description: '"invalid request body", "user_id is required", invalid user_id UUID shape, "user_id must be a member of this workspace".'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '403':
        description: writeErrorCode via autopilotAccessRefusal (autopilot.go:686-691) — `autopilot_no_originator` or `autopilot_forbidden` ("only the autopilot creator or a workspace admin can manage access").
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorCode'
      '404':
        description: '"autopilot not found".'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '500':
        description: '"failed to grant access" (autopilot.go:1465), or "failed to load collaborators" from the shared writeAutopilotCollaborators helper (autopilot.go:1406).'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/api/autopilots/{id}/collaborators/{userId}:
  delete:
    operationId: removeAutopilotCollaborator
    summary: Revoke a member's explicit write access to an autopilot
    description: >-
      Same access-management gate as the grant endpoint (MUL-3807): only the
      creator or a workspace owner/admin may revoke. Revoking a user with no
      explicit grant row is a no-op at the DB layer (DeleteAutopilotCollaborator
      on a non-existent row) — confirmed the handler does not special-case
      "nothing to revoke" into its own status code; it falls through to the
      same success response. Implicit writers (creator/owner/admin) are
      unaffected by this endpoint either way — there is no grant row to remove
      for them (autopilot.go:1475-1478).
    tags: [Autopilots]
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - CloudNodePAT: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: userId
        in: path
        required: true
        description: The collaborator's user id (userType is implicitly "member" — not a path/query param).
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Revoked. Returns the FULL current collaborator list (writeAutopilotCollaborators with 200, autopilot.go:1509) — not 204.
        content:
          application/json:
            schema:
              type: object
              required: [collaborators]
              additionalProperties: false
              properties:
                collaborators:
                  type: array
                  items:
                    type: object
                    description: AutopilotCollaboratorEntry.
                    required: [user_type, user_id, granted_by, created_at]
                    additionalProperties: false
                    properties:
                      user_type: { type: string, const: member }
                      user_id: { type: string, format: uuid }
                      granted_by: { type: string, format: uuid }
                      created_at: { type: string, format: date-time }
      '400':
        description: id, workspace id, or userId is not a well-formed UUID.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '403':
        description: writeErrorCode via autopilotAccessRefusal — `autopilot_no_originator` or `autopilot_forbidden`.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorCode'
      '404':
        description: '"autopilot not found".'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '500':
        description: '"failed to revoke access" (autopilot.go:1502), or "failed to load collaborators".'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

# Domain: autopilots/triggers, runs, deliveries
# Source of truth for this file: server/internal/handler/autopilot.go
# (CreateAutopilotTrigger ~1514, UpdateAutopilotTrigger ~1876,
# DeleteAutopilotTrigger ~2048, RotateAutopilotTriggerWebhookToken ~2122,
# SetAutopilotTriggerSigningSecret ~2191, ListAutopilotRuns ~2256,
# GetAutopilotRun ~2306) and server/internal/handler/webhook_delivery.go
# (ListAutopilotDeliveries ~161, GetAutopilotDelivery ~209,
# ReplayAutopilotDelivery ~237). WebhookEventFilter is defined in
# server/internal/handler/autopilot_webhook.go (~637).
#
# Security: every route in this domain sits under
# r.Group { middleware.Auth } > r.Group { middleware.RequireWorkspaceMember }
# in server/cmd/server/router.go (~2159-2184), with no further per-route
# middleware gating — confirmed by reading that block. Fine-grained
# authorization (who may WRITE a given autopilot/trigger) is enforced
# inside each handler via requireAutopilotWrite, not by router middleware,
# so it is documented per-operation below via the 403 responses.
#
# Repeated response bodies (AutopilotTriggerResponse, AutopilotRunResponse,
# WebhookDeliveryResponse, the event_filters item shape) are written out
# in full at first use and reused via plain YAML anchors/aliases (&name /
# *name) — this is NOT an OpenAPI $ref (no new components file is created,
# per this ticket's rules); it is resolved by the YAML parser itself into
# literal duplicate content, so every operation below is still fully
# self-contained inline JSON Schema once parsed.
#
# Top-level keys are path strings merged verbatim into the document's
# "paths" object by scripts/merge.mjs — do not nest under "paths:".

/api/autopilots/{id}/triggers:
  post:
    operationId: createAutopilotTrigger
    summary: Create a trigger for an autopilot
    description: >-
      Creates a schedule or webhook trigger on the given autopilot
      (server/internal/handler/autopilot.go:1514, `CreateAutopilotTrigger`).


      Validation performed by the handler, in order: `kind` is required and
      must be `schedule` or `webhook` (the `api` kind is deprecated/rejected
      with 400 — it was reserved-but-inert and is no longer accepted on
      create); `schedule` requires a non-empty `cron_expression`; `webhook`
      rejects a non-empty `timezone` (webhooks have no `next_run_at` to
      compute); `event_filters` is rejected on non-webhook kinds;
      `event_filters` entries are validated (each `event` and each
      `actions[]` entry must be non-empty); `provider` is only valid for
      `kind=webhook` and must be `generic` or `github` (defaults to
      `generic` when omitted); a non-empty `timezone` is validated via
      `service.ValidateTimezone`.


      For `kind=webhook`, the server mints a fresh bearer token
      (`webhook_token`) atomically with the INSERT (retried up to 3 times
      on a token-collision unique-violation) and republishes the
      autopilot's rule version in the same transaction, attributing both
      `created_by` (immutable authorization principal) and `published_by`
      to the acting member. For `kind=schedule`, `next_run_at` is computed
      from `cron_expression` + `timezone` (default `UTC`) via
      `computeNextRun`, and the same rule-version republish happens inside
      an explicit transaction.


      Write access is gated by `requireAutopilotWrite`, which resolves the
      acting member (self for a member caller, the run's ORIGINATOR for an
      agent caller) and requires that member to hold write access on this
      autopilot (creator, workspace owner/admin, or a granted
      collaborator).
    tags: [Autopilots]
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - CloudNodePAT: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: id
        in: path
        required: true
        description: Autopilot id.
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [kind]
            properties:
              kind:
                type: string
                enum: [schedule, webhook]
                description: >-
                  Trigger kind. `api` was a previously-reserved third value;
                  the handler now rejects it with 400 ("kind must be
                  schedule or webhook") since it never had a dispatch path
                  of its own.
              cron_expression:
                type: ["string", "null"]
                description: Required (non-empty) when kind=schedule.
              timezone:
                type: ["string", "null"]
                description: >-
                  Only valid for kind=schedule; a non-empty value on
                  kind=webhook is rejected with 400. Validated via
                  service.ValidateTimezone when non-empty.
              label:
                type: ["string", "null"]
              provider:
                type: ["string", "null"]
                enum: [generic, github]
                description: >-
                  Only valid for kind=webhook. Defaults to "generic" when
                  omitted/empty. Any other value is rejected with 400.
              event_filters: &webhookEventFiltersArray
                type: array
                description: >-
                  Only valid for kind=webhook; rejected with 400 on
                  kind=schedule. nil/empty means "accept all events".
                items: &webhookEventFilterItem
                  type: object
                  description: >-
                    server/internal/handler/autopilot_webhook.go:637. One
                    declared event and an optional list of actions;
                    nil/empty actions means "any action" for this event.
                  required: [event]
                  properties:
                    event:
                      type: string
                      description: Must not be empty (validated server-side).
                    actions:
                      type: array
                      items:
                        type: string
                        description: Must not be empty (validated server-side).
    responses:
      '201':
        description: Trigger created.
        content:
          application/json:
            schema: &autopilotTriggerResponse
              type: object
              description: >-
                server/internal/handler/autopilot.go:121 (struct) / :222
                (`triggerToResponse`). Returned by all five trigger
                endpoints in this file.
              required:
                - id
                - autopilot_id
                - kind
                - enabled
                - cron_expression
                - timezone
                - next_run_at
                - webhook_token
                - webhook_path
                - webhook_url
                - provider
                - has_signing_secret
                - signing_secret_hint
                - label
                - last_fired_at
                - created_at
                - updated_at
              properties:
                id:
                  type: string
                  format: uuid
                autopilot_id:
                  type: string
                  format: uuid
                kind:
                  type: string
                  enum: [schedule, webhook]
                  description: >-
                    Confirmed enum values from CreateAutopilotTrigger's
                    validation (autopilot.go ~1550): only "schedule" and
                    "webhook" can be persisted via this surface. The legacy
                    "api" kind is rejected on create and has no dispatch
                    path, but a pre-existing row of that kind cannot be
                    ruled out from handler source alone.
                    # 소스에서 확인 불가: DB에 과거 kind="api" 행이 실제로
                    # 남아있는지.
                enabled:
                  type: boolean
                cron_expression:
                  type: ["string", "null"]
                timezone:
                  type: ["string", "null"]
                next_run_at:
                  type: ["string", "null"]
                  format: date-time
                webhook_token:
                  type: ["string", "null"]
                  description: >-
                    Present (non-null) only when the trigger is
                    kind=webhook. All five trigger endpoints in this file
                    require requireAutopilotWrite before returning this
                    shape, so the direct HTTP response always carries the
                    live value for a webhook trigger; the field is nulled
                    out ONLY on the separate autopilot:updated WebSocket
                    broadcast copy (broadcastAutopilotTriggerResponse /
                    redactWebhookSecrets), which is out of scope for this
                    REST surface.
                webhook_path:
                  type: ["string", "null"]
                  description: >-
                    Computed from webhook_token as
                    "/api/webhooks/autopilots/{token}". Always present for
                    kind=webhook when a token exists; nil for
                    kind=schedule.
                webhook_url:
                  type: ["string", "null"]
                  description: >-
                    Absolute URL (server's configured public URL +
                    webhook_path). Nil when the server has no public URL
                    configured, even for a kind=webhook trigger.
                provider:
                  type: ["string", "null"]
                  enum: [generic, github]
                  description: Omitted in practice (nil) for non-webhook triggers.
                has_signing_secret:
                  type: boolean
                  description: Always false for non-webhook triggers.
                signing_secret_hint:
                  type: ["string", "null"]
                  description: Last 4 characters of the configured secret; nil if unset.
                label:
                  type: ["string", "null"]
                last_fired_at:
                  type: ["string", "null"]
                  format: date-time
                created_at:
                  type: string
                  format: date-time
                updated_at:
                  type: string
                  format: date-time
                event_filters:
                  type: array
                  description: >-
                    Only present (non-empty) for kind=webhook triggers that
                    declared a scope; omitted entirely (omitempty) when the
                    trigger accepts all events or is not kind=webhook.
                  items: *webhookEventFilterItem
      '400':
        description: >-
          Invalid request body, missing/invalid `kind`, missing
          `cron_expression` for a schedule trigger, `timezone` set on a
          webhook trigger, `event_filters` set on a non-webhook trigger,
          an invalid event_filters entry, an invalid `provider` value, or
          an invalid `timezone`.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '403':
        description: >-
          The acting member cannot write this autopilot. `code` is
          `autopilot_no_originator` when the calling agent run records no
          human originator, or `autopilot_forbidden` when the resolved
          human is not the autopilot's creator, a workspace owner/admin, or
          a granted collaborator.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorCode'
      '404':
        description: >-
          Autopilot not found in this workspace, OR (same status, via the
          write-gate's underlying workspace-membership check) the acting
          member is not a member of this workspace.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '500':
        description: >-
          Failed to create the trigger (including exhausting 3 webhook
          token-mint retries) or failed to encode event_filters.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/api/autopilots/{id}/triggers/{triggerId}:
  patch:
    operationId: updateAutopilotTrigger
    summary: Update a trigger
    description: >-
      Partially updates a trigger (server/internal/handler/autopilot.go:1876,
      `UpdateAutopilotTrigger`). All fields are optional; only supplied
      fields are applied.


      Kind-specific validation mirrors create: `cron_expression` and
      `timezone` are rejected with 400 on a non-schedule trigger. A
      non-empty `timezone` is validated via `service.ValidateTimezone`.
      `event_filters` uses tri-state PATCH semantics: omitted/JSON-null
      leaves the stored value untouched; an explicit `[]` clears filters
      (reverts to "accept all events"); a populated array replaces the
      stored value. `event_filters` is rejected with 400 when the trigger
      is not kind=webhook. `next_run_at` is recomputed from the
      (possibly just-updated) cron_expression/timezone when the trigger is
      kind=schedule and the effective cron expression is non-empty.


      Only a SUBSTANTIVE change — `enabled`, `cron_expression`,
      `timezone`, or `event_filters` actually differing from the
      previously-stored row — republishes the autopilot's rule version and
      re-stamps this trigger's `published_by` to the editor; a label-only
      edit or a no-op PATCH does neither (next_run_at is derived, not an
      independent signal).


      Write access is gated by `requireAutopilotWrite` (see POST
      /triggers for the exact predicate).
    tags: [Autopilots]
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - CloudNodePAT: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: id
        in: path
        required: true
        description: Autopilot id.
        schema:
          type: string
          format: uuid
      - name: triggerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              enabled:
                type: ["boolean", "null"]
              cron_expression:
                type: ["string", "null"]
                description: Only valid when the trigger is kind=schedule.
              timezone:
                type: ["string", "null"]
                description: Only valid when the trigger is kind=schedule.
              label:
                type: ["string", "null"]
              event_filters:
                type: ["array", "null"]
                description: >-
                  Tri-state PATCH: omit the field or send JSON null to
                  leave the existing value untouched; send `[]` to clear
                  filters; send a populated array to replace. Only valid
                  when the trigger is kind=webhook.
                items: *webhookEventFilterItem
    responses:
      '200':
        description: Updated trigger.
        content:
          application/json:
            schema: *autopilotTriggerResponse
      '400':
        description: >-
          Invalid request body; `cron_expression`/`timezone` supplied for
          a non-schedule trigger; `event_filters` supplied for a
          non-webhook trigger; an invalid event_filters entry; or an
          invalid `timezone`/`cron_expression`.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '403':
        description: >-
          The acting member cannot write this autopilot. Same two codes as
          POST /triggers (`autopilot_no_originator` / `autopilot_forbidden`).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorCode'
      '404':
        description: >-
          Autopilot not found, trigger not found (including a triggerId
          that exists but belongs to a different autopilot), or the acting
          member is not a workspace member.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '500':
        description: Failed to update the trigger or encode event_filters.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

  delete:
    operationId: deleteAutopilotTrigger
    summary: Delete a trigger
    description: >-
      Deletes a trigger (server/internal/handler/autopilot.go:2048,
      `DeleteAutopilotTrigger`). Deletion is always a substantive change
      (it changes what fires), so it republishes the autopilot's rule
      version atomically with the delete, attributing the republish to the
      acting member. Write access is gated by `requireAutopilotWrite`.
    tags: [Autopilots]
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - CloudNodePAT: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: id
        in: path
        required: true
        description: Autopilot id.
        schema:
          type: string
          format: uuid
      - name: triggerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '204':
        description: Trigger deleted. No response body.
      '400':
        description: Invalid autopilot id, trigger id, or workspace id.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '403':
        description: >-
          The acting member cannot write this autopilot. Same two codes as
          POST /triggers.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorCode'
      '404':
        description: >-
          Autopilot not found, trigger not found (including a triggerId
          belonging to a different autopilot), or the acting member is not
          a workspace member.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '500':
        description: Failed to delete the trigger.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/api/autopilots/{id}/triggers/{triggerId}/rotate-webhook-token:
  post:
    operationId: rotateAutopilotTriggerWebhookToken
    summary: Rotate a webhook trigger's bearer token
    description: >-
      Issues a fresh bearer token for an existing webhook trigger
      (server/internal/handler/autopilot.go:2122,
      `RotateAutopilotTriggerWebhookToken`). The old token stops working
      immediately — the public ingress route looks up triggers by the
      current `webhook_token` value. Rejected with 400 when the trigger is
      not kind=webhook. Retries up to 3 times internally on a token
      unique-violation. Write access is gated by `requireAutopilotWrite`.
      Returns the full updated trigger (same shape as the other trigger
      endpoints), so the new token/path/URL are all present in the
      response.
    tags: [Autopilots]
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - CloudNodePAT: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: id
        in: path
        required: true
        description: Autopilot id.
        schema:
          type: string
          format: uuid
      - name: triggerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Trigger with the newly rotated webhook_token/path/url.
        content:
          application/json:
            schema: *autopilotTriggerResponse
      '400':
        description: >-
          Invalid trigger id, or the trigger is not kind=webhook ("trigger
          is not a webhook trigger").
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '403':
        description: >-
          The acting member cannot write this autopilot. Same two codes as
          POST /triggers.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorCode'
      '404':
        description: >-
          Autopilot not found, trigger not found (including a triggerId
          belonging to a different autopilot), or the acting member is not
          a workspace member.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '500':
        description: >-
          Failed to generate a webhook token, or failed to rotate it
          (including exhausting the 3 retry attempts on persistent
          unique-violation).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/api/autopilots/{id}/triggers/{triggerId}/signing-secret:
  put:
    operationId: setAutopilotTriggerSigningSecret
    summary: Set or clear a webhook trigger's HMAC signing secret
    description: >-
      Sets (non-empty `signing_secret`) or clears (empty/omitted
      `signing_secret`) the HMAC signing secret used to verify inbound
      webhook deliveries (server/internal/handler/autopilot.go:2191,
      `SetAutopilotTriggerSigningSecret`). Lives on its own endpoint,
      deliberately separate from the general PATCH, so the secret value
      never shares a request body with other fields and is kept out of
      generic request-body logs.


      Rejected with 400 when the trigger is not kind=webhook, or when a
      non-empty secret is shorter than 16 characters (the enforced floor;
      GitHub/Slack-style secrets are 32 chars). The response is the full
      trigger (same shape as other trigger endpoints) and — per the
      shared response contract — the secret itself is NEVER echoed back;
      only `has_signing_secret` (bool) and `signing_secret_hint` (last 4
      chars, nil if unset) reflect the change. Write access is gated by
      `requireAutopilotWrite`.
    tags: [Autopilots]
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - CloudNodePAT: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: id
        in: path
        required: true
        description: Autopilot id.
        schema:
          type: string
          format: uuid
      - name: triggerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              signing_secret:
                type: string
                description: >-
                  New HMAC key. Whitespace-trimmed server-side. An empty
                  string (or omitted body field) explicitly CLEARS the
                  secret, reverting the trigger to bearer-token-only
                  authentication. A non-empty value shorter than 16
                  characters is rejected with 400.
    responses:
      '200':
        description: >-
          Updated trigger. Never includes the secret itself; reflects the
          change via has_signing_secret / signing_secret_hint only.
        content:
          application/json:
            schema: *autopilotTriggerResponse
      '400':
        description: >-
          Invalid request body, invalid trigger id, the trigger is not
          kind=webhook, or a non-empty signing_secret under 16 characters.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '403':
        description: >-
          The acting member cannot write this autopilot. Same two codes as
          POST /triggers.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorCode'
      '404':
        description: >-
          Autopilot not found, trigger not found (including a triggerId
          belonging to a different autopilot), or the acting member is not
          a workspace member.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '500':
        description: Failed to update the signing secret.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/api/autopilots/{id}/runs:
  get:
    operationId: listAutopilotRuns
    summary: List runs for an autopilot
    description: >-
      Lists runs for the given autopilot
      (server/internal/handler/autopilot.go:2256, `ListAutopilotRuns`).
      # 소스에서 확인 불가: 정렬 순서가 쿼리(ListAutopilotRuns SQL)에서 명시적으로
      # ORDER BY 되는지 — handler 코드만으로는 정렬 컬럼을 확인하지 못했다.


      Pagination is OFFSET-based, not cursor-based: `limit` (default 20,
      parsed from the query string; any value >100 is clamped down to
      100) and `offset` (default 0). This does NOT match the shared
      cursor-pagination components (`LimitParam`/`NextCursorParam`), so
      this operation documents its own `limit`/`offset` query parameters
      instead of referencing those components.


      The list response omits `trigger_payload` on every row
      (`runToResponseSlim`) — a webhook envelope can be up to 256 KiB and
      with up to 100 rows per page the full payload would dominate
      response size. Fetch `GET /runs/{runId}` for the full payload. This
      endpoint has no write gate — any workspace member who can load the
      autopilot (loadAutopilotInWorkspace) can list its runs.
    tags: [Autopilots]
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - CloudNodePAT: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: id
        in: path
        required: true
        description: Autopilot id.
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        required: false
        description: >-
          Page size. Values <= 0 or non-numeric fall back to the default
          20; values above 100 are clamped to 100.
        schema:
          type: integer
          default: 20
          maximum: 100
      - name: offset
        in: query
        required: false
        description: Row offset. Negative or non-numeric values fall back to 0.
        schema:
          type: integer
          default: 0
          minimum: 0
    responses:
      '200':
        description: Page of runs (trigger_payload forced to null on every row).
        content:
          application/json:
            schema:
              type: object
              required: [runs, total]
              properties:
                runs:
                  type: array
                  items: &autopilotRunResponse
                    type: object
                    description: >-
                      server/internal/handler/autopilot.go:162 (struct) /
                      :319 (`runToResponse`) / :351
                      (`runToResponseSlim`, used by this list endpoint —
                      identical shape with trigger_payload forced to
                      null).
                    required:
                      - id
                      - autopilot_id
                      - trigger_id
                      - source
                      - status
                      - issue_id
                      - task_id
                      - triggered_at
                      - completed_at
                      - failure_reason
                      - trigger_payload
                      - result
                      - created_at
                    properties:
                      id:
                        type: string
                        format: uuid
                      autopilot_id:
                        type: string
                        format: uuid
                      trigger_id:
                        type: ["string", "null"]
                        format: uuid
                      source:
                        type: string
                        description: >-
                          # 소스에서 확인 불가: 전체 enum 값 목록 — handler는
                          # DB 컬럼을 그대로 string으로 통과시킬 뿐 서버
                          # 코드에서 값 집합을 검증하지 않는다.
                          # "direct_human"은 TriggerAutopilot(수동 실행)
                          # 경로의 주석에서 확인했지만, schedule/webhook
                          # 경로가 쓰는 정확한 문자열은 이 두 핸들러 파일
                          # 범위에서 확정하지 못했다.
                      status:
                        type: string
                        description: >-
                          # 소스에서 확인 불가: 전체 enum 값 목록 —
                          # "skipped"는 TriggerAutopilot 응답 분기에서
                          # 확인했으나(autopilot.go ~2411), 그 외 상태 값
                          # (예: succeeded/failed/running)은 이 티켓 범위의
                          # 두 핸들러 파일에서 직접 확인하지 못했다.
                      issue_id:
                        type: ["string", "null"]
                        format: uuid
                      task_id:
                        type: ["string", "null"]
                        format: uuid
                      triggered_at:
                        type: string
                        format: date-time
                      completed_at:
                        type: ["string", "null"]
                        format: date-time
                      failure_reason:
                        type: ["string", "null"]
                      reason_code:
                        type: ["string", "null"]
                        description: >-
                          Stable classification of a non-success run; nil
                          for legacy/success-path runs. omitempty on the
                          wire when nil.
                      trigger_payload:
                        description: >-
                          Arbitrary JSON (unmarshalled from the stored
                          JSONB column), or null. ALWAYS null on this list
                          endpoint regardless of what is actually stored —
                          `runToResponseSlim` force-clears it to keep page
                          responses small; fetch GET /runs/{runId} for the
                          real value.
                      result:
                        description: >-
                          Arbitrary JSON (unmarshalled from the stored
                          JSONB column), or null.
                      created_at:
                        type: string
                        format: date-time
                total:
                  type: integer
                  description: >-
                    Count of rows in THIS page (len(resp)), not a total
                    row count across all pages.
      '404':
        description: Autopilot not found in this workspace.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '500':
        description: Failed to list runs.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/api/autopilots/{id}/runs/{runId}:
  get:
    operationId: getAutopilotRun
    summary: Get a single autopilot run
    description: >-
      Returns one run including its full `trigger_payload`
      (server/internal/handler/autopilot.go:2306, `GetAutopilotRun`).
      Workspace scoping is enforced via the autopilot lookup; the run is
      then re-checked to belong to THIS autopilot so a runId guessed from
      another autopilot in the same workspace 404s instead of leaking
      data. No write gate — any workspace member who can load the
      autopilot can read any of its runs.
    tags: [Autopilots]
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - CloudNodePAT: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: id
        in: path
        required: true
        description: Autopilot id.
        schema:
          type: string
          format: uuid
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Full run, including trigger_payload.
        content:
          application/json:
            schema: *autopilotRunResponse
      '400':
        description: Invalid run id.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '404':
        description: >-
          Autopilot not found, run not found, or the run exists but
          belongs to a different autopilot (same "run not found" message
          and status, to avoid leaking cross-autopilot existence).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/api/autopilots/{id}/deliveries:
  get:
    operationId: listAutopilotDeliveries
    summary: List webhook deliveries for an autopilot
    description: >-
      Lists recent webhook deliveries for the given autopilot
      (server/internal/handler/webhook_delivery.go:161,
      `ListAutopilotDeliveries`). Slim projection — `selected_headers`,
      `raw_body`, and `response_body` are always omitted on this endpoint
      (not just conditionally); use `GET /deliveries/{deliveryId}` for the
      full payload.


      Pagination is OFFSET-based, not cursor-based: `limit` (default 20,
      clamped to a maximum of 100) and `offset` (default 0) — identical
      parsing/clamping behavior to `GET /runs`. This does not match the
      shared cursor-pagination components, so this operation documents its
      own `limit`/`offset` parameters. No write gate — any workspace
      member who can load the autopilot can list its deliveries.
    tags: [Autopilots]
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - CloudNodePAT: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: id
        in: path
        required: true
        description: Autopilot id.
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        required: false
        description: >-
          Page size. Values <= 0 or non-numeric fall back to the default
          20; values above 100 are clamped to 100.
        schema:
          type: integer
          default: 20
          maximum: 100
      - name: offset
        in: query
        required: false
        description: Row offset. Negative or non-numeric values fall back to 0.
        schema:
          type: integer
          default: 0
          minimum: 0
    responses:
      '200':
        description: Page of deliveries (slim projection).
        content:
          application/json:
            schema:
              type: object
              required: [deliveries, total]
              properties:
                deliveries:
                  type: array
                  items: &webhookDeliveryResponse
                    type: object
                    description: >-
                      server/internal/handler/webhook_delivery.go:26
                      (struct) / :61 (`slimDeliveryToResponse`, used by
                      this list endpoint) / :102 (`deliveryToResponse`,
                      used by GET /deliveries/{deliveryId} and the replay
                      endpoint with detail=true). This list endpoint's
                      slim projection has the exact same required fields
                      EXCEPT selected_headers/raw_body/response_body are
                      never populated here (handler comment: "list
                      endpoint returns these without RawBody /
                      SelectedHeaders populated").
                    required:
                      - id
                      - workspace_id
                      - autopilot_id
                      - trigger_id
                      - provider
                      - event
                      - dedupe_key
                      - dedupe_source
                      - signature_status
                      - status
                      - attempt_count
                      - dispatch_attempts
                      - available_at
                      - content_type
                      - response_status
                      - autopilot_run_id
                      - replayed_from_delivery_id
                      - error
                      - reason_code
                      - replay_idempotency_key
                      - received_at
                      - last_attempt_at
                      - created_at
                    properties:
                      id:
                        type: string
                        format: uuid
                      workspace_id:
                        type: string
                        format: uuid
                      autopilot_id:
                        type: string
                        format: uuid
                      trigger_id:
                        type: string
                        format: uuid
                      provider:
                        type: string
                        description: >-
                          # 소스에서 확인 불가: 전체 enum 값 목록. "generic"/
                          # "github"는 트리거 쪽 provider 값으로 확인했으나,
                          # 이 값이 delivery 행에도 동일하게 제한되는지는 이
                          # 두 핸들러 파일 범위에서 확정하지 못했다.
                      event:
                        type: string
                      dedupe_key:
                        type: ["string", "null"]
                      dedupe_source:
                        type: ["string", "null"]
                      signature_status:
                        type: string
                        description: >-
                          Confirmed value: "invalid" (sigStatusInvalid,
                          gates replay rejection). "not_required" is used
                          explicitly when constructing a replay row
                          (sigStatusNotRequired). Other possible values
                          (e.g. a "valid"/"verified" case) are referenced
                          only by constant name in this ticket's two
                          files, not enumerated from their definitions.
                          # 소스에서 확인 불가: sigStatus* 상수의 전체
                          # 정의/값 목록 (정의는 이 티켓 범위 밖의 다른
                          # 위치에 있을 가능성).
                      status:
                        type: string
                        description: >-
                          Confirmed values actually branched on in this
                          ticket's files: "rejected"
                          (deliveryStatusRejected, blocks replay), "queued"
                          (deliveryStatusQueued, set on a new replay row),
                          "ignored" (deliveryStatusIgnored, set on
                          quota-exceeded admission failure). Other values
                          are referenced only by constant name, not
                          enumerated here.
                          # 소스에서 확인 불가: deliveryStatus* 상수의 전체
                          # 정의/값 목록.
                      attempt_count:
                        type: integer
                        format: int32
                      dispatch_attempts:
                        type: integer
                        format: int32
                      available_at:
                        type: string
                        format: date-time
                      content_type:
                        type: ["string", "null"]
                      response_status:
                        type: ["integer", "null"]
                        format: int32
                      autopilot_run_id:
                        type: ["string", "null"]
                        format: uuid
                      replayed_from_delivery_id:
                        type: ["string", "null"]
                        format: uuid
                        description: >-
                          Set on a replay-created row to the original
                          delivery's id; null on an originally-received
                          delivery.
                      error:
                        type: ["string", "null"]
                      reason_code:
                        type: ["string", "null"]
                      replay_idempotency_key:
                        type: ["string", "null"]
                      received_at:
                        type: string
                        format: date-time
                      last_attempt_at:
                        type: string
                        format: date-time
                      created_at:
                        type: string
                        format: date-time
                      selected_headers:
                        description: >-
                          Detail-only (omitempty): a small JSON object of
                          captured request headers. Always absent on this
                          list endpoint; present on
                          GET /deliveries/{deliveryId} and on the replay
                          response when the original/replay row has a
                          non-empty value.
                      raw_body:
                        type: ["string", "null"]
                        description: >-
                          Detail-only (omitempty when absent): the raw
                          request body as received. Always absent on this
                          list endpoint.
                      response_body:
                        type: ["string", "null"]
                        description: >-
                          Detail-only (omitempty when absent): the stored
                          response body text. Always absent on this list
                          endpoint.
                total:
                  type: integer
                  description: Count of rows in THIS page, not a global total.
      '404':
        description: Autopilot not found in this workspace.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '500':
        description: Failed to list deliveries.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/api/autopilots/{id}/deliveries/{deliveryId}:
  get:
    operationId: getAutopilotDelivery
    summary: Get a single webhook delivery, in full
    description: >-
      Returns one delivery including `selected_headers`, `raw_body`, and
      `response_body` (server/internal/handler/webhook_delivery.go:209,
      `GetAutopilotDelivery`). Workspace-scoped via the autopilot lookup;
      the delivery is then re-checked to belong to this autopilot
      (`loadDeliveryForAutopilot`) so a guessed delivery id from another
      autopilot/workspace 404s instead of leaking data. No write gate —
      any workspace member who can load the autopilot can read any of its
      deliveries, including raw bodies/headers.
    tags: [Autopilots]
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - CloudNodePAT: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: id
        in: path
        required: true
        description: Autopilot id.
        schema:
          type: string
          format: uuid
      - name: deliveryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Full delivery, including selected_headers/raw_body/response_body.
        content:
          application/json:
            schema: *webhookDeliveryResponse
      '400':
        description: Invalid delivery id.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '404':
        description: >-
          Autopilot not found, or delivery not found (including a
          deliveryId that exists but belongs to a different autopilot or
          workspace).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '500':
        description: Failed to load the delivery.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/api/autopilots/{id}/deliveries/{deliveryId}/replay:
  post:
    operationId: replayAutopilotDelivery
    summary: Replay a previously received webhook delivery
    description: >-
      Creates a NEW queued delivery row from a prior one, carrying
      `replayed_from_delivery_id` for correlation
      (server/internal/handler/webhook_delivery.go:237,
      `ReplayAutopilotDelivery`). The existing durable delivery worker owns
      actual dispatch of the new row; this endpoint only enqueues it and,
      if a worker handle is configured, calls `Notify()` to wake it.


      Rejected with 400 when: the original delivery's status is
      `rejected` or its signature_status is `invalid` (replaying a
      rejected/forged payload would defeat the original rejection); the
      original has no stored raw body to replay; the parent autopilot's
      status is not `active`; or the original delivery's trigger is
      disabled. Returns 404 when the original delivery's trigger cannot be
      loaded at all (distinct from the disabled-trigger 400 case above).


      The replay deliberately bypasses provider dedupe by inserting with a
      NULL `dedupe_key` (reusing the original key would collapse the
      replay onto the prior delivery via the partial unique index) — "a
      replay is explicitly 'run this again'". The replay response itself
      IS deduplicated by `(original delivery, Idempotency-Key)`: resending
      the same `Idempotency-Key` header for the same original delivery
      returns the SAME already-created replay row (same full-delivery
      body, 202 status) instead of creating a second one, whether that
      short-circuit happens via an upfront lookup or via catching a
      unique-violation on insert and re-looking-up. Omitting
      `Idempotency-Key` mints a fresh server-generated key per call (so
      omitting it does NOT dedupe repeat calls). Write access is gated by
      `requireAutopilotWrite`.
    tags: [Autopilots]
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - CloudNodePAT: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - $ref: '#/components/parameters/IdempotencyKeyHeader'
      - name: id
        in: path
        required: true
        description: Autopilot id.
        schema:
          type: string
          format: uuid
      - name: deliveryId
        in: path
        required: true
        description: The ORIGINAL delivery id to replay.
        schema:
          type: string
          format: uuid
    responses:
      '202':
        description: >-
          Replay delivery created (or, for a repeated Idempotency-Key
          against the same original delivery, the SAME previously-created
          replay delivery returned again) — full delivery shape including
          raw_body/selected_headers/response_body.
        content:
          application/json:
            schema: *webhookDeliveryResponse
      '400':
        description: >-
          Idempotency-Key header too long (>255 chars); original delivery
          failed signature verification (status=rejected or
          signature_status=invalid) and cannot be replayed; original
          delivery has no raw body to replay; autopilot is not active; or
          the original delivery's trigger is disabled.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '403':
        description: >-
          The acting member cannot write this autopilot. Same two codes as
          POST /triggers.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorCode'
      '404':
        description: >-
          Autopilot not found, original delivery not found (cross-autopilot
          or cross-workspace id), the acting member is not a workspace
          member, or the original delivery's trigger row cannot be loaded.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '500':
        description: >-
          Failed to inspect a prior replay request by idempotency key, or
          failed to insert the new replay delivery row.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

# Domain: Chat (/api/chat/*)
# Source: server/internal/handler/chat.go, chat_history.go, chat_pinned_agent.go,
# mika_onboarding.go; router.go (~line 2396-2432, 2430-2434) for routing/grouping.
#
# All operations below sit inside the same router.go nesting:
#   r.Group { r.Use(middleware.Auth(...)) } -> r.Group { r.Use(middleware.RequireWorkspaceMember(queries)) }
# with no additional per-route gating, so every operation uses the identical
# security block (PersonalAccessToken / AgentTaskToken / CloudNodePAT /
# BrowserSession) and the same three header parameters, per the shared
# conventions for this ticket.
#
# EXCEPTION (confirmed in handler body, not just routing): GetChatChannelHistory
# and GetChatThread additionally require `X-Actor-Source: task_token` inside the
# handler itself (chatHistorySession, chat_history.go ~line 246) — a header the
# client cannot set directly; the auth middleware stamps it only when the
# request authenticated via an AgentTaskToken (mat_), discarding any
# client-supplied value (MUL-2600). So although the security block below is
# kept identical per the shared-security instruction, these two operations are
# in practice only reachable via AgentTaskToken. Noted in each operation's
# description rather than silently narrowing the `security:` list.
#
# Top-level keys are path strings merged verbatim into the document's "paths"
# object — add operations here, not under a nested "paths:" key.

/api/chat/history:
  get:
    operationId: getChatChannelHistory
    tags: [Chat]
    summary: Read the caller's own chat session's bound channel history (agent-facing)
    description: >-
      Serves `multica chat history` — the channel overview: recent top-level
      messages, each thread tagged with its id + reply count (no thread
      contents). The session is resolved server-side from the caller's own
      task-scoped token (chatHistorySession); there is no session/channel id
      parameter — the caller always reads its own chat session's history.
      Practically reachable only with an AgentTaskToken (mat_): the handler
      additionally requires the server-stamped `X-Actor-Source: task_token`
      header (see the domain-level note above).


      When the session is bound to Slack, reads through the Slack history
      reader (channel.ChatChannelHistoryReader.ChannelOverview). When it is not
      channel-backed (web chat, Feishu, or no Slack integration configured at
      all), falls back to the session's own stored transcript
      (chat_message table), oldest-first, paged by the same ?limit/?before
      contract (default 30, max 50 per this fallback path — the Slack reader's
      own default/max were not re-derived from source in this ticket).
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - CloudNodePAT: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: limit
        in: query
        required: false
        description: >-
          Page size. 0/absent means "use the reader's default". Confirmed
          default 30 / max 50 only for the no-channel (stored transcript)
          fallback path (chat_history.go clampTranscriptLimit); the
          Slack-backed reader's own clamp was not re-derived from source here.
        schema:
          type: integer
          minimum: 0
      - name: before
        in: query
        required: false
        description: >-
          Opaque pagination cursor from a previous page's `next_cursor`.
          Fetches messages strictly older than it. For the stored-transcript
          fallback this encodes `<RFC3339Nano created_at>|<message id>`; treat
          it as opaque regardless.
        schema:
          type: string
    responses:
      '200':
        description: >-
          Channel overview, or a note explaining why there is nothing to read
          (not channel-backed, or no channel integration configured) — both are
          200s, not errors.
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                channel_type:
                  type: string
                  description: >-
                    Platform the history came from (e.g. "slack"). Empty/absent
                    when the session is not bound to any channel.
                thread_id:
                  type: string
                  description: Set only on a thread read; absent here.
                messages:
                  type: array
                  items:
                    type: object
                    required: [id, author, role, text, ts]
                    properties:
                      id:
                        type: string
                        description: Platform message identifier (Slack ts, Feishu message_id), or the chat_message row id on the stored-transcript fallback.
                      author:
                        type: string
                        description: >-
                          Human-readable sender label ("Alice", "Bot", or a
                          positional "User 2" fallback); "User"/"Bot" on the
                          stored-transcript fallback (transcriptAuthor).
                      author_id:
                        type: string
                        description: Platform-native sender id, when available.
                      role:
                        type: string
                        enum: [user, assistant]
                      text:
                        type: string
                      ts:
                        type: string
                        description: >-
                          Platform timestamp string (doubles as a paging
                          cursor); on the stored-transcript fallback this is
                          an RFC3339Nano timestamp instead of a platform-native
                          value.
                      thread_id:
                        type: string
                        description: >-
                          Set only on a channel-overview row that heads a
                          thread, so the agent can `multica chat thread <id>`.
                      reply_count:
                        type: integer
                      latest_reply:
                        type: string
                next_cursor:
                  type: string
                note:
                  type: string
                  description: >-
                    Explains an empty result in terms the agent can act on, e.g.
                    "This conversation is not connected to a chat channel..." or
                    "This conversation is on <platform>, whose backlog this
                    server cannot read...", or (no Slack integration at all)
                    "No chat channel integration is configured on this server."
      '400':
        description: missing/invalid task context
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '403':
        description: >-
          not called from within an agent task (X-Actor-Source != task_token),
          or the resolved chat session does not belong to this request's
          workspace
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '404':
        description: >-
          task not found / task is not a chat task is 400 not 404 (see above);
          404 covers task not found, chat session not found, or (when the task
          carries a channel-context revision) chat context generation not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '500':
        description: the session's channel binding could not be read
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '502':
        description: the channel history read itself failed (e.g. Slack API error)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/api/chat/thread:
  get:
    operationId: getChatThread
    tags: [Chat]
    summary: Read one thread's messages in the caller's own chat session (agent-facing)
    description: >-
      Serves `multica chat thread [id]`. With `?id` reads that specific
      thread; without it, reads the thread the session is currently pinned to.
      The channel stays server-resolved to the caller's own session exactly
      like GetChatChannelHistory (same chatHistorySession loader, same
      practical AgentTaskToken-only reachability — see the domain-level note).


      Unlike the history endpoint, this operation has NO stored-transcript
      fallback: when no Slack integration is configured at all
      (`h.SlackHistory == nil`), it returns a 200 with a fixed note ("No chat
      channel integration is configured on this server.") and an empty
      message list, rather than reading chat_message.
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - CloudNodePAT: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: id
        in: query
        required: false
        description: >-
          The thread id to read (a platform thread identifier, e.g. a Slack
          thread ts). Omit to read the session's own pinned thread.
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
      - name: before
        in: query
        required: false
        description: Opaque pagination cursor from a previous page's `next_cursor`.
        schema:
          type: string
    responses:
      '200':
        description: >-
          Thread messages, or (no Slack integration configured) a 200 note
          with an empty message list.
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                channel_type:
                  type: string
                thread_id:
                  type: string
                messages:
                  type: array
                  items:
                    type: object
                    required: [id, author, role, text, ts]
                    properties:
                      id:
                        type: string
                        description: Platform message identifier (Slack ts, Feishu message_id).
                      author:
                        type: string
                        description: >-
                          Human-readable sender label ("Alice", "Bot", or a
                          positional "User 2" fallback).
                      author_id:
                        type: string
                        description: Platform-native sender id, when available.
                      role:
                        type: string
                        enum: [user, assistant]
                      text:
                        type: string
                      ts:
                        type: string
                        description: >-
                          Platform timestamp string (doubles as a paging
                          cursor); not an RFC3339 timestamp.
                      thread_id:
                        type: string
                        description: >-
                          Set only on a channel-overview row that heads a
                          thread; absent on thread-read rows (this endpoint).
                      reply_count:
                        type: integer
                      latest_reply:
                        type: string
                next_cursor:
                  type: string
                note:
                  type: string
      '400':
        description: missing/invalid task context
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '403':
        description: >-
          not called from within an agent task, or the resolved chat session
          does not belong to this request's workspace
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '404':
        description: task not found / chat session not found / chat context generation not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '500':
        description: the session's channel binding could not be read
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '502':
        description: the channel history read itself failed
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/api/chat/pending-tasks:
  get:
    operationId: listPendingChatTasks
    tags: [Chat]
    summary: List every in-flight chat task owned by the current user in this workspace
    description: >-
      Drives the FAB's "running" indicator when the chat window is closed.
      Tasks belonging to private agents the caller has lost access to are
      dropped from the response (accessibleAgentIDs filter, same set
      ListChatSessions uses).
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - CloudNodePAT: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
    responses:
      '200':
        description: Pending chat tasks (possibly empty).
        content:
          application/json:
            schema:
              type: object
              required: [tasks]
              properties:
                tasks:
                  type: array
                  items:
                    type: object
                    required: [task_id, status, chat_session_id]
                    properties:
                      task_id:
                        type: string
                        format: uuid
                      status:
                        type: string
                      chat_session_id:
                        type: string
                        format: uuid
      '400':
        description: workspace_id is required (empty X-Workspace-ID/-Slug)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '401':
        description: user not authenticated
        content:
          application/json:
