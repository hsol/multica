/api/chat/sessions/{sessionId}/messages:
  post:
    operationId: sendChatMessage
    tags: [Chat]
    summary: Send a user message into a chat session, enqueuing an agent turn
    description: >-
      The richest write in this domain, but the wire request body itself is
      deliberately thin: plain text content plus a list of already-uploaded
      attachment ids (uploaded separately via the attachments API beforehand).
      There is no inline quoted-reply or mention structure in this request —
      none was found in SendChatMessageRequest.


      Preflight order (each one can short-circuit before anything is
      persisted): private-agent + public-projection gate, session must be
      'active', agent must not be archived, AgentReadiness must not report
      AgentBlocked (409, with a dispatch reason_code — see responses), and the
      INVOKE permission must still hold (403, reason_code
      invocation_not_allowed) — re-checked on every send, not just at session
      creation, because workspace role / agent ownership can change in
      between (MUL-4525). Only after all of that does
      TaskService.SendDirectChatMessage persist the user message + its owning
      task + attachment bindings atomically.


      The first human message in a session best-effort triggers async LLM
      auto-titling (fire-and-forget; never blocks or affects this response).
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - CloudNodePAT: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [content]
            properties:
              content:
                type: string
                description: Required, non-empty.
              attachment_ids:
                type: array
                items:
                  type: string
                  format: uuid
                description: >-
                  Ids of attachments previously uploaded via the attachments
                  API, to bind to this message.
    responses:
      '201':
        description: Created — the user message and its owning task were persisted.
        content:
          application/json:
            schema:
              type: object
              required: [message_id, task_id, supports_queue, queued, attachment_ids, created_at]
              properties:
                message_id:
                  type: string
                  format: uuid
                task_id:
                  type: string
                  format: uuid
                supports_queue:
                  type: boolean
                  description: Always true on this build.
                queued:
                  type: boolean
                  description: >-
                    True when this send became a queued follow-up behind an
                    already-running turn for the session, rather than starting
                    immediately.
                attachment_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: >-
                    Attachment ids the server actually bound to this message.
                    Always present (`[]`, never omitted) when attachments were
                    requested, so the client can diff against what it asked
                    for and warn on a silent bind failure; `null` only when no
                    attachments were requested at all.
                created_at:
                  type: string
                  format: date-time
                  description: >-
                    Anchors the chat status-pill timer at send time; sourced
                    from the task's created_at, not the message's.
      '400':
        description: invalid request body / content is required / invalid attachment_ids / chat session is archived (session.status != active)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '401':
        description: user not authenticated
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '403':
        description: >-
          not your chat session (view gate), OR the structured dispatch-blocked
          body below when the INVOKE permission does not hold
          (reason_code=invocation_not_allowed)
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/Error'
                - type: object
                  description: >-
                    server/internal/handler/admission.go dispatchBlockedResponse, written
                    by writeDispatchBlocked. NOT the shared ErrorCode schema — field name
                    is `reason_code`, not `code`, and the enum is dispatch.ReasonCode (a
                    separate, cross-layer vocabulary), not the writeErrorCode `code` enum.
                  required: [error, reason_code]
                  properties:
                    error:
                      type: string
                      description: >-
                        Generic, non-enumerating English fallback message, fixed per
                        reason_code by dispatchBlockedFallbackMessage.
                    reason_code:
                      type: string
                      description: >-
                        Full dispatch.ReasonCode vocabulary (server/internal/dispatch/reason.go).
                        Only a subset is actually reachable from this domain's operations
                        (invocation_not_allowed from canInvokeAgent; agent_runtime_required,
                        runtime_access_denied, runtime_unusable, runtime_profile_missing
                        from AgentReadiness on sendChatMessage) — the enum below lists the
                        full type for forward-compatibility since clients are required to
                        default-branch on an unknown value, not the narrower reachable
                        subset.
                      enum:
                        - queued
                        - coalesced
                        - deferred
                        - steered
                        - invocation_not_allowed
                        - target_unavailable
                        - runtime_offline
                        - runtime_unusable
                        - runtime_access_denied
                        - runtime_profile_missing
                        - agent_runtime_required
                        - attribution_blocked
                        - already_active
                        - self_trigger_suppressed
                        - issue_in_triage
                        - quota_exceeded
                        - issue_limit_reached
                        - internal_error
      '404':
        description: chat session not found / agent not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '409':
        description: >-
          chat agent is archived (plain Error), OR chat session is archived /
          chat agent has no runtime (plain Error, from
          TaskService.SendDirectChatMessage's own sentinel errors), OR the
          structured dispatch-blocked body when AgentReadiness reports the
          agent AgentBlocked — reason_code one of agent_runtime_required,
          runtime_access_denied, runtime_unusable, runtime_profile_missing
          (target_unavailable is also a possible AgentReadiness reason but is
          pre-empted by the plain "chat agent is archived" check just above it
          in this handler, so it is not reachable through this path in
          practice)
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/Error'
                - type: object
                  description: >-
                    server/internal/handler/admission.go dispatchBlockedResponse, written
                    by writeDispatchBlocked. NOT the shared ErrorCode schema — field name
                    is `reason_code`, not `code`, and the enum is dispatch.ReasonCode (a
                    separate, cross-layer vocabulary), not the writeErrorCode `code` enum.
                  required: [error, reason_code]
                  properties:
                    error:
                      type: string
                      description: >-
                        Generic, non-enumerating English fallback message, fixed per
                        reason_code by dispatchBlockedFallbackMessage.
                    reason_code:
                      type: string
                      description: >-
                        Full dispatch.ReasonCode vocabulary (server/internal/dispatch/reason.go).
                        Only a subset is actually reachable from this domain's operations
                        (invocation_not_allowed from canInvokeAgent; agent_runtime_required,
                        runtime_access_denied, runtime_unusable, runtime_profile_missing
                        from AgentReadiness on sendChatMessage) — the enum below lists the
                        full type for forward-compatibility since clients are required to
                        default-branch on an unknown value, not the narrower reachable
                        subset.
                      enum:
                        - queued
                        - coalesced
                        - deferred
                        - steered
                        - invocation_not_allowed
                        - target_unavailable
                        - runtime_offline
                        - runtime_unusable
                        - runtime_access_denied
                        - runtime_profile_missing
                        - agent_runtime_required
                        - attribution_blocked
                        - already_active
                        - self_trigger_suppressed
                        - issue_in_triage
                        - quota_exceeded
                        - issue_limit_reached
                        - internal_error
      '500':
        description: failed to load chat agent / failed to send chat message (generic fallback, message includes the underlying error)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
  get:
    operationId: listChatMessages
    tags: [Chat]
    summary: List every visible message in a chat session (no pagination)
    description: >-
      Returns the full transcript in one response, oldest message implied by
      storage order (ListChatMessages' own ORDER BY — ascending, not
      re-sorted by the handler). Onboarding-kickoff rows (hidden
      product-authored context) are filtered out via visibleChatMessages; the
      daemon's own task input read (ListChatInputMessages) is unaffected by
      this user-facing filter. For a paginated read of the same transcript see
      GET .../messages/page, which uses a different envelope (limit/has_more/
      next_cursor vs this endpoint's bare array).
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - CloudNodePAT: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: OK — a bare array, not an envelope.
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                description: server/internal/handler/chat.go ChatMessageResponse
                required: [id, chat_session_id, role, content, task_id, created_at, failure_reason, elapsed_ms, message_kind, quick_actions]
                properties:
                  id:
                    type: string
                    format: uuid
                  chat_session_id:
                    type: string
                    format: uuid
                  role:
                    type: string
                    enum: [user, assistant]
                  content:
                    type: string
                  task_id:
                    type: ["string", "null"]
                    format: uuid
                  created_at:
                    type: string
                    format: date-time
                  failure_reason:
                    type: ["string", "null"]
                    description: Set on an assistant row synthesized by FailTask's chat fallback.
                  elapsed_ms:
                    type: ["integer", "null"]
                    format: int64
                    description: Wall-clock duration from task creation to terminal state.
                  message_kind:
                    type: string
                    enum: [message, no_response, onboarding_kickoff, onboarding_opening]
                    description: >-
                      onboarding_kickoff rows are filtered out of both message-list
                      endpoints before this response is built (visibleChatMessages), so
                      in practice this field never actually carries that value on
                      either listing endpoint — kept in the enum because the wire type
                      is shared with other internal representations.
                  quick_actions:
                    type: array
                    description: Always `[]` for legacy rows and user messages; capped at 3 entries.
                    items:
                      type: object
                      required: [label, prompt]
                      properties:
                        label:
                          type: string
                        prompt:
                          type: string
                        primary:
                          type: boolean
                  attachments:
                    type: array
                    items:
                      type: object
                      description: server/internal/handler/file.go AttachmentResponse
                      required: [id, workspace_id, issue_id, comment_id, chat_session_id, chat_message_id, uploader_type, uploader_id, filename, url, download_url, markdown_url, content_type, size_bytes, created_at]
                      properties:
                        id:
                          type: string
                          format: uuid
                        workspace_id:
                          type: string
                          format: uuid
                        issue_id:
                          type: ["string", "null"]
                          format: uuid
                        comment_id:
                          type: ["string", "null"]
                          format: uuid
                        chat_session_id:
                          type: ["string", "null"]
                          format: uuid
                        chat_message_id:
                          type: ["string", "null"]
                          format: uuid
                        uploader_type:
                          type: string
                        uploader_id:
                          type: string
                          format: uuid
                        filename:
                          type: string
                        url:
                          type: string
                          description: Raw storage object URL; may be private/signed/site-relative.
                        download_url:
                          type: string
                          description: >-
                            URL to use for THIS response's render; may be short-lived
                            (signed) and must not be persisted.
                        attachment_download_url:
                          type: string
                          description: >-
                            Credential-free forced-download URL. Only emitted by the
                            single-attachment endpoint (outside this domain), never in list
                            responses such as these — so always absent here.
                        markdown_url:
                          type: string
                          description: Durable, persistable URL safe to embed in markdown bodies.
                        content_type:
                          type: string
                        size_bytes:
                          type: integer
                          format: int64
                        created_at:
                          type: string
                          format: date-time
      '400':
        description: invalid chat session id / invalid workspace id
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '401':
        description: user not authenticated
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '403':
        description: not your chat session / you do not have access to this agent
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '404':
        description: chat session not found / agent not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '500':
        description: failed to list chat messages
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/api/chat/sessions/{sessionId}/messages/page:
  get:
    operationId: listChatMessagesPage
    tags: [Chat]
    summary: Paginated read of a chat session's messages
    description: >-
      A DIFFERENT pagination style from GET .../messages: this is a true
      cursor page (limit/has_more/next_cursor envelope), windowed newest-first
      internally then reversed to chronological order before serializing. The
      cursor is a (created_at, id) pair split across TWO separate query
      params (before_created_at + before_id), not the single opaque
      `next_cursor` string style used elsewhere in the API — so the shared
      NextCursorParam component does not apply here; this endpoint defines its
      own two-param cursor inline. Internally over-fetches by 2 rows beyond
      `limit` to absorb a possible hidden onboarding-kickoff row without
      shrinking a visible page or losing its cursor.
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - CloudNodePAT: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        required: false
        description: Page size. Default 50, must be 1-100 inclusive if provided.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: before_created_at
        in: query
        required: false
        description: >-
          Cursor half 1/2: RFC3339Nano timestamp from a previous page's
          `next_cursor.created_at`. Must be supplied together with
          before_id (both or neither).
        schema:
          type: string
          format: date-time
      - name: before_id
        in: query
        required: false
        description: >-
          Cursor half 2/2: message id from a previous page's
          `next_cursor.id`. Must be supplied together with before_created_at.
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: object
              required: [messages, limit, has_more]
              properties:
                messages:
                  type: array
                  items:
