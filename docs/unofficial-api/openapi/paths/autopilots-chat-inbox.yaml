/api/inbox/{id}/archive:
  post:
    operationId: archiveInboxItem
    summary: Archive a single inbox item (and every sibling item for the same issue)
    description: >-
      Bodiless. Loads via loadInboxItemForUser (same 400/404s as `/read`).
      When the item is linked to an issue (`issue_id` valid), this ALSO
      archives every OTHER sibling inbox item for that same issue
      (`ArchiveInboxByIssue`) — an issue-level archive, not a single-row
      archive — though that sibling fan-out's own query error is not
      checked/surfaced (no additional error path from it). Emits
      `EventInboxArchived` with both `item_id` and (if present) `issue_id`.
