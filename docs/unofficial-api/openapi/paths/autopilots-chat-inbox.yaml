                            content_type:
                              type: string
                            size_bytes:
                              type: integer
                              format: int64
                            created_at:
                              type: string
                              format: date-time
                      created_at:
                        type: string
                        format: date-time
      '400':
        description: invalid chat session id / invalid workspace id
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '401':
        description: user not authenticated
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '403':
        description: not your chat session
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '404':
        description: chat session not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '500':
        description: failed to list draft restores / failed to load draft restore attachments
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/api/chat/sessions/{sessionId}/draft-restores/{restoreId}:
  delete:
    operationId: consumeChatDraftRestore
    tags: [Chat]
    summary: Consume (delete) one draft restore after the creator's client applies it
    description: >-
      Idempotent by design: consuming an already-consumed (or never existing)
      restore id still returns 204, so a retried consume after a lost response
      cannot fail the client. Creator-only (loadChatSessionForUser), same
      rationale as listChatDraftRestores.
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - CloudNodePAT: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: restoreId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '204':
        description: Consumed (or was already gone — idempotent).
      '400':
        description: invalid chat session id / invalid workspace id / invalid restore id
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '401':
        description: user not authenticated
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '403':
        description: not your chat session
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '404':
        description: chat session not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '500':
        description: failed to consume draft restore
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

# Domain: Inbox / Notification Preferences
# Owner: this domain ticket.
# Top-level keys are path strings merged verbatim into the document's
# "paths" object by scripts/merge.mjs — add operations here, not under a
# nested "paths:" key.
#
# Sources read in full:
#   server/internal/handler/inbox.go
#   server/internal/handler/inbox_archive.go
#   server/internal/handler/notification_preference.go
#   server/internal/handler/handler.go (writeError/writeErrorCode/parseUUIDOrBadRequest/
#     requireUserID/loadInboxItemForUser/ctxWorkspaceID helpers)
#   server/internal/handler/issue_status.go (terminalIssueStatusKeys, used by
#     ArchiveCompletedInbox)
#
# Shared InboxItemResponse shape (handler.go type InboxItemResponse), repeated
# inline per this ticket's convention rather than $ref'd, since domain schemas
# are inline-only:
#   id, workspace_id, recipient_id, actor_id: uuid strings (actor_id nullable)
#   recipient_type, type, severity, title: non-null strings
#   issue_id: nullable uuid string
#   body: nullable string — for `type: "new_comment"` list rows ONLY, this is
#     truncated to a <=200-character preview ending in "…" (inboxListBody);
#     single-item responses (read/unread/archive/unarchive) and all other
#     notification types always carry the full stored body.
#   read, archived: bool
#   created_at: date-time string
#   issue_status, issue_priority: nullable strings — populated from a joined
#     column on LIST endpoints, and via a best-effort separate GetIssue lookup
#     (silently left null on error, no error surfaced) on the single-item
#     mutation endpoints (read/unread/archive/unarchive)
#   actor_type: nullable string
#   details: arbitrary JSON object/value (json.RawMessage passthrough)

/api/inbox:
  get:
    operationId: listInbox
    summary: List active (non-archived) inbox notifications
    description: >-
      Returns every non-archived inbox notification for the authenticated
      member in the active workspace, newest first (per
      ListInboxItems). No query filters, no pagination — the full active
      list is returned in one response. `body` is truncated to a 200-char
      preview (ending in "…") only for `type: "new_comment"` rows; all other
      rows carry the full stored body.
    tags: [Inbox]
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - CloudNodePAT: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
    responses:
      '200':
        description: Active inbox items for the authenticated member.
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required:
                  - id
                  - workspace_id
                  - recipient_type
                  - recipient_id
                  - type
                  - severity
                  - title
                  - read
                  - archived
                  - created_at
                properties:
                  id: { type: string, format: uuid }
                  workspace_id: { type: string, format: uuid }
                  recipient_type: { type: string }
                  recipient_id: { type: string, format: uuid }
                  type: { type: string }
                  severity: { type: string }
                  issue_id: { type: ["string", "null"], format: uuid }
                  title: { type: string }
                  body: { type: ["string", "null"] }
                  read: { type: boolean }
                  archived: { type: boolean }
                  created_at: { type: string, format: date-time }
                  issue_status: { type: ["string", "null"] }
                  issue_priority: { type: ["string", "null"] }
                  actor_type: { type: ["string", "null"] }
                  actor_id: { type: ["string", "null"], format: uuid }
                  details: {}
      '400':
        description: Missing/invalid workspace id (`workspace id` resolved from context).
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
      '401':
        description: Not authenticated (`user not authenticated`).
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
      '500':
        description: '`failed to list inbox`.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }

/api/inbox/archived:
  get:
    operationId: listArchivedInbox
    summary: List archived inbox notifications (unbounded, unfiltered)
    description: >-
      Returns the recipient's archived notifications, kept as a separate
      endpoint from `/api/inbox` so the unbounded archive never rides along
      with the main list. Per ListArchivedInboxItems, the underlying query
      drops any issue that also has an active (non-archived) row, selects at
      most 200 groups, and returns only each group's newest row — this is NOT
      the same pagination contract as `/api/inbox/archived/page` (no
      limit/cursor query params here; this endpoint takes none). No
      kind/read/project filters are accepted.
    tags: [Inbox]
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - CloudNodePAT: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
    responses:
      '200':
        description: Archived inbox items (at most 200 issue-groups, newest row each).
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required:
                  - id
                  - workspace_id
                  - recipient_type
                  - recipient_id
                  - type
                  - severity
                  - title
                  - read
                  - archived
                  - created_at
                properties:
                  id: { type: string, format: uuid }
                  workspace_id: { type: string, format: uuid }
                  recipient_type: { type: string }
                  recipient_id: { type: string, format: uuid }
                  type: { type: string }
                  severity: { type: string }
                  issue_id: { type: ["string", "null"], format: uuid }
                  title: { type: string }
                  body: { type: ["string", "null"] }
                  read: { type: boolean }
                  archived: { type: boolean }
                  created_at: { type: string, format: date-time }
                  issue_status: { type: ["string", "null"] }
                  issue_priority: { type: ["string", "null"] }
                  actor_type: { type: ["string", "null"] }
                  actor_id: { type: ["string", "null"], format: uuid }
                  details: {}
      '400':
        description: Missing/invalid workspace id.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
      '401':
        description: Not authenticated.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
      '500':
        description: '`failed to list archived inbox`.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }

/api/inbox/archived/page:
  get:
    operationId: listArchivedInboxPage
    summary: Page through archived inbox notifications with filters (cursor-based, NOT the shared LimitParam/NextCursorParam shape)
    description: >-
      Distinct pagination contract from the generic LimitParam/NextCursorParam
      components: `limit` here is bounded 1-100 (default 50, enforced with a
      literal `strconv.Atoi` check in ListArchivedInboxPage, not the shared
      1-200/default-50 component contract), and the cursor is an
      implementation-specific opaque string: base64(raw-url, no padding) of a
      JSON object `{time, id, scope}` where `scope` is a sha256 hex digest
      binding the cursor to this exact recipient + filter selection (+
      optional `group_id`) via `archivedInboxScope`. A cursor minted under one
      filter combination is rejected (`invalid archive cursor`) if replayed
      under a different one. Internally this fetches `limit+1` rows to derive
      `has_more` as a one-after-limit peek. When a row carries a
      `comment_id` anchor, the response's `details.comment_id` is
      injected/overwritten with it even if `details` had no such key.
    tags: [Inbox]
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - CloudNodePAT: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: statuses
        in: query
        required: false
        description: >-
          Comma-separated list of issue status keys to filter by. Max 8192
          raw chars, max 100 values after split, no empty values, deduped
          and sorted server-side.
        schema: { type: string }
      - name: priorities
        in: query
        required: false
        description: Comma-separated list of issue priority keys to filter by. Same limits as `statuses`.
        schema: { type: string }
      - name: actors
        in: query
        required: false
        description: Comma-separated list of actor ids to filter by. Same limits as `statuses`.
        schema: { type: string }
      - name: unread_only
        in: query
        required: false
        description: 'Must be exactly `"true"` or `"false"` if present; any other value is a 400.'
        schema: { type: string, enum: ["true", "false"] }
      - name: limit
        in: query
        required: false
        description: Page size. Must parse as an integer in [1, 100]; default 50.
        schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      - name: group_id
        in: query
        required: false
        description: Optional issue-group id to scope the page to a single archived group.
        schema: { type: string, format: uuid }
      - name: cursor
        in: query
        required: false
        description: >-
          Opaque pagination cursor from a previous page's `next_cursor`. Max
          2048 chars. Rejected with 400 if malformed, undecodable, or scoped
          to a different recipient/filter/group combination than the current
          request.
        schema: { type: string }
    responses:
      '200':
        description: One page of archived inbox items.
        content:
          application/json:
            schema:
              type: object
              required: [items, has_more]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required:
                      - id
                      - workspace_id
                      - recipient_type
                      - recipient_id
                      - type
                      - severity
                      - title
                      - read
                      - archived
                      - created_at
                    properties:
                      id: { type: string, format: uuid }
                      workspace_id: { type: string, format: uuid }
                      recipient_type: { type: string }
                      recipient_id: { type: string, format: uuid }
                      type: { type: string }
                      severity: { type: string }
                      issue_id: { type: ["string", "null"], format: uuid }
                      title: { type: string }
                      body: { type: ["string", "null"] }
                      read: { type: boolean }
                      archived: { type: boolean }
                      created_at: { type: string, format: date-time }
                      issue_status: { type: ["string", "null"] }
                      issue_priority: { type: ["string", "null"] }
                      actor_type: { type: ["string", "null"] }
                      actor_id: { type: ["string", "null"], format: uuid }
                      details: {}
                next_cursor:
                  type: ["string", "null"]
                  description: Opaque cursor for the next page; absent/null when `has_more` is false.
                has_more:
                  type: boolean
      '400':
        description: >-
          Missing/invalid workspace id; invalid/too-long/too-many/empty
          filter values; invalid `unread_only`; `limit must be between 1 and
          100`; invalid `group_id`; `invalid archive cursor`; `invalid
          archive cursor time`; invalid cursor id.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
      '401':
        description: Not authenticated.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
      '500':
        description: '`failed to load archived inbox page`, or `invalid archived notification details` if a row''s stored details is malformed JSON.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }

/api/inbox/archived/facets:
  get:
    operationId: getArchivedInboxFacets
    summary: Aggregate counts per filter dimension for archived inbox
    description: >-
      Returns per-value counts (status / priority / actor) plus an overall
      unread count, scoped by the SAME filter query params as
      `/api/inbox/archived/page` (statuses/priorities/actors/unread_only) —
      used to render facet/filter-chip counts without paging through items.
      No limit/cursor/group_id params (facets are not paginated).
    tags: [Inbox]
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - CloudNodePAT: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: statuses
        in: query
        required: false
        description: Comma-separated list of issue status keys to filter by. Same limits as the `page` endpoint.
        schema: { type: string }
      - name: priorities
        in: query
        required: false
        description: Comma-separated list of issue priority keys to filter by.
        schema: { type: string }
      - name: actors
        in: query
        required: false
        description: Comma-separated list of actor ids to filter by.
        schema: { type: string }
      - name: unread_only
        in: query
        required: false
        description: 'Must be exactly `"true"` or `"false"` if present.'
        schema: { type: string, enum: ["true", "false"] }
    responses:
      '200':
        description: Facet counts for the archived inbox under the given filters.
        content:
          application/json:
            schema:
              type: object
              required: [statuses, priorities, actors, unread_count]
              properties:
                statuses:
                  type: object
                  description: Map of issue status key -> matching archived item count.
                  additionalProperties: { type: integer, format: int64 }
                priorities:
                  type: object
                  description: Map of issue priority key -> matching archived item count.
                  additionalProperties: { type: integer, format: int64 }
                actors:
                  type: object
                  description: Map of actor id -> matching archived item count.
                  additionalProperties: { type: integer, format: int64 }
                unread_count:
                  type: integer
                  format: int64
      '400':
        description: >-
          Missing/invalid workspace id; invalid/too-long/too-many/empty
          filter values; invalid `unread_only`.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
      '401':
        description: Not authenticated.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
      '500':
        description: '`failed to load archived inbox filters`.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }

/api/inbox/unread-count:
  get:
    operationId: countUnreadInbox
    summary: Count unread (active) inbox items in the current workspace
    description: >-
      Returns the count of non-archived, unread inbox items for the
      authenticated member in the active workspace (CountUnreadInbox).
    tags: [Inbox]
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - CloudNodePAT: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
    responses:
      '200':
        description: Unread count for the authenticated member in the active workspace.
        content:
          application/json:
            schema:
              type: object
              required: [count]
              properties:
                count: { type: integer, format: int64 }
      '400':
        description: Missing/invalid workspace id.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
      '401':
        description: Not authenticated.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
      '500':
        description: '`failed to count unread inbox`.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }

/api/inbox/unread-summary:
  get:
    operationId: unreadInboxSummary
    summary: Per-workspace unread inbox counts across every workspace the user belongs to
    description: >-
      Account-level by design (UnreadInboxSummary doc comment): it keys only
      on the authenticated user and ignores the active workspace entirely —
      used by the workspace switcher to light an unread dot on workspaces
      OTHER than the currently active one. No X-Workspace-ID/Slug is consulted
      by the handler even though the headers are still accepted on the
      request per the shared security/parameter contract.
    tags: [Inbox]
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - CloudNodePAT: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
    responses:
      '200':
        description: One entry per workspace the user has unread items in.
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required: [workspace_id, count]
                properties:
                  workspace_id: { type: string, format: uuid }
                  count: { type: integer, format: int64 }
      '401':
        description: Not authenticated.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
      '500':
        description: '`failed to summarize unread inbox`.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }

/api/inbox/mark-all-read:
  post:
    operationId: markAllInboxRead
    summary: Mark every active inbox item read in the current workspace
    description: >-
      Bodiless — MarkAllInboxRead reads no request body, takes no filter
      scope. Scoped to workspace + authenticated recipient only. Returns a
      count of affected rows, not the items themselves, and emits an
      `EventInboxBatchRead` websocket event (not documented here; out of
