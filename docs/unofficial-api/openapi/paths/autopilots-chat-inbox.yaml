                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
      '400':
        description: workspace_id is required
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '401':
        description: user not authenticated
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '404':
        description: workspace not found
        content:
          application/json:
