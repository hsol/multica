/api/daemon/runtimes/{runtimeId}/tasks/{taskId}/skill-bundles/resolve:
  post:
    operationId: ResolveTaskSkillBundles
    summary: Resolve a task's skill bundles against the daemon's cache
    tags: [daemon]
    description: >-
      Lets a daemon confirm its cached local skill files are current so
      runtimes see complete skill content at startup. If a requested hash no
      longer matches the agent's current skill bundle, returns the current
      bundle and hash instead; Stage 1 does not snapshot skill content at
      claim time, so the daemon validates the returned bundle before
      writing it to cache and materializing it. 내부 데몬 전용, 스키마
      미기재 — see server/internal/handler/daemon.go, ResolveTaskSkillBundles.
    security:
      - DaemonAuth: []
    parameters:
