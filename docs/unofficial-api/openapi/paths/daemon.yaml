/api/daemon/workspaces/{workspaceId}/issues/gc-check:
  post:
    operationId: BatchIssueGCCheck
    summary: Batch GC-eligibility check for issues
    tags: [daemon]
    description: >-
      Returns one explicit result for every requested issue id. The query
      is workspace-scoped at the SQL layer; missing rows and ids owned by
      another workspace both become found=false so the endpoint is not an
      enumeration oracle. The request count is capped because installed
      daemons run this periodically and must not be able to produce
      unbounded DB work. 내부 데몬 전용, 스키마 미기재 — see
      server/internal/handler/daemon.go, BatchIssueGCCheck.
    security:
      - DaemonAuth: []
    parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: 내부 데몬 전용, 스키마 미기재.
      "401":
        description: Missing/invalid/malformed Authorization header.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

