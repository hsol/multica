      (server/internal/daemonws). Not representable as a normal HTTP
      request/response pair; 2xx response schema intentionally omitted per
      the originating ticket. See server/internal/handler/daemon_ws.go,
      DaemonWebSocket.
    security:
      - DaemonAuth: []
    responses:
      "101":
        description: Switching Protocols — WebSocket handshake accepted. No body.
      "401":
        description: Missing/invalid/malformed Authorization header.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/api/daemon/workspaces:
  get:
    operationId: ListDaemonWorkspaces
    summary: List workspaces visible to this daemon
    tags: [daemon]
    description: >-
      Minimal workspace-membership projection for local daemons. A
      user-scoped PAT/JWT caller gets every workspace it belongs to; a
      workspace-scoped daemon token (mdt_) gets only its bound workspace.
      Eventual-consistency safe — downstream daemon endpoints authorize
      their own requests rather than trusting this list as an admission
      decision. 내부 데몬 전용, 스키마 미기재 — see
      server/internal/handler/daemon_workspace.go, ListDaemonWorkspaces.
    security:
