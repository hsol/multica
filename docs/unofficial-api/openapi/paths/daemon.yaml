/api/daemon/tasks/claim:
  post:
    operationId: ClaimTasksByRuntime
    summary: Claim queued tasks across runtimes (batch, canonical)
    tags: [daemon]
    description: >-
      Canonical machine-level batch claim (MUL-4257). Each returned task
      goes through the same FinalizeTaskClaim as the per-runtime endpoint,
      so the task-scoped token and the comment-delivery receipt
      (delivered_comment_ids) persist atomically; a finalization failure
      requeues that claim and omits it from the batch. Unknown/unauthorized
      runtime_ids are skipped silently. Shares a handler with
      `POST /api/daemon/claim` (see below). 내부 데몬 전용, 스키마 미기재 —
      see server/internal/handler/daemon.go, ClaimTasksByRuntime.
    security:
      - DaemonAuth: []
    responses:
      "200":
        description: 내부 데몬 전용, 스키마 미기재.
      "401":
        description: Missing/invalid/malformed Authorization header.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

