/api/daemon/runtimes/{runtimeId}/recover-orphans:
  post:
    operationId: RecoverOrphanedTasks
    summary: Recover tasks orphaned by a daemon restart
    tags: [daemon]
    description: >-
      On daemon restart, re-queues tasks the runtime heartbeat sweeper
      believes belong to that runtime (tasks the previous daemon process
      was running when it died) and triggers a retry for each, so the user
      sees a fresh attempt instead of a permanently stuck row. Targeted fix
      for "issue stuck at in_progress when daemon restarts mid-task": the
      heartbeat sweeper alone takes up to 75s plus the in-process task
      timeout (2.5h) to notice; the daemon knows the moment it comes back
      up. 내부 데몬 전용, 스키마 미기재 — see
      server/internal/handler/task_lifecycle.go, RecoverOrphanedTasks.
    security:
      - DaemonAuth: []
    parameters:
      - name: runtimeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: 내부 데몬 전용, 스키마 미기재.
      "401":
        description: Missing/invalid/malformed Authorization header.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

