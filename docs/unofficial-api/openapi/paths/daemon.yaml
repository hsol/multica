# Domain: daemon
# Owner: dedicated domain ticket.
# Top-level keys are path strings merged verbatim into the document's
# "paths" object by scripts/merge.mjs — add operations here, not under a
# nested "paths:" key.
#
# Internal-only domain (local daemon <-> server protocol, not an external
# consumer surface). Per the originating ticket's acceptance condition 3,
# request/response schemas are omitted; every operation below says so in its
# own `description` instead of guessing a shape. Every operation is
# cross-checked against server/cmd/server/router.go's `/api/daemon` route
# group (~line 1554-1609) and carries `security: [{DaemonAuth: []}]`, the
# dedicated scheme `middleware.DaemonAuth` mounts on that group (distinct
# from the five schemes the other domain files use — see
# openapi/components/securitySchemes.yaml). `401` is listed on every
# operation because DaemonAuth rejects a missing/invalid/wrong-prefix bearer
# token with `writeError(w, 401, ...)` (server/internal/middleware/daemon_auth.go)
# before any handler-specific logic runs; that is the one response shape
# verified identically across all 38 operations, so it is written out in
# full instead of also being left as "스키마 미기재".
#
# Router.go lists 38 chi route registrations under r.Route("/api/daemon",
# ...), not 39 — the originating ticket's endpoint count/table both say 39
# but enumerate only 38 distinct path+method pairs (verified: `grep -oE
# 'r\.(Get|Post)\("[^"]*"' ` over router.go's daemon block, and independently
# against server/internal/daemon/client.go's caller-side paths). All 38 are
# registered below; none were dropped.

/api/daemon/register:
  post:
    operationId: DaemonRegister
    summary: Register a daemon runtime
    tags: [daemon]
    description: >-
      Registers (or re-registers) a daemon process with the server. 내부
      데몬 전용, 스키마 미기재 — see server/internal/handler/daemon.go,
      DaemonRegister.
    security:
      - DaemonAuth: []
    responses:
      "200":
        description: 내부 데몬 전용, 스키마 미기재.
      "401":
        description: Missing/invalid/malformed Authorization header.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

