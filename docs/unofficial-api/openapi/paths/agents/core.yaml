/api/working-agents:
  get:
    operationId: listWorkspaceWorkingAgents
    summary: List currently-working agents in the workspace
    description: >-
      server/internal/handler/agent.go:2804-2924
      (`ListWorkspaceWorkingAgents`). Independent of issue filters or Table
      pagination; backs the issues-header "agents working" chip and its
      assignee-id Table filter. `type` narrows to one work source;
      `scope=mine` (issue work only) further narrows to the caller's
      selected My-Issues relation; `parent` narrows to one issue's direct
      children. Rows for an agent the caller cannot access are silently
      dropped (same accessibleAgentIDs visibility as ListAgents) — a
      private/non-allow-listed agent is never exposed by name, avatar,
      count, or even presence.
    tags: [agents]
    security: *agentsAuth
    parameters:
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: type
        in: query
        schema: { type: string, enum: [issue, autopilot, chat] }
        description: 'Omitted selects the all-sources projection.'
      - name: scope
        in: query
        schema: { type: string, enum: [mine] }
        description: 'Only "mine" is accepted when present; requires type=issue (or type omitted — scope=mine itself forces the issue source). Cannot be combined with `parent`.'
      - name: relation
        in: query
        schema: { type: string, enum: [assigned, created, involved, any], default: any }
        description: 'Only meaningful with scope=mine (a 400 otherwise); defaults to "any" when scope=mine is set but relation is omitted.'
      - name: parent
        in: query
        schema: { type: string, format: uuid }
        description: 'Narrows to one issue''s direct children. Requires type=issue; cannot be combined with scope. Omitted/absent applies no narrowing (workspace-wide).'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/WorkspaceWorkingAgent' }
      '400':
        description: >-
          Common workspace-gate 400s (see file header), plus: "invalid type:
          must be issue, autopilot, or chat"; "relation requires
          scope=mine"; "scope=mine requires type=issue"; "invalid relation:
          must be assigned, created, involved, or any"; "invalid scope: must
          be mine"; "parent requires type=issue"; "parent cannot be combined
          with scope"; "invalid parent".
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
      '401':
        description: >-
          Common workspace-gate 401 (see file header), or "user not
          authenticated" (requireUserID's own check, reached only with
          scope=mine).
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
      '403':
        description: 'Common workspace-gate 403 (see file header).'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
      '404':
        description: 'Common workspace-gate 404 (see file header).'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
      '500':
        description: '"failed to list workspace working agents"; "failed to resolve agent access".'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }

