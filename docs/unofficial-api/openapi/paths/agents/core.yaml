/api/tasks/{taskId}/messages:
  get:
    operationId: listTaskMessagesByUser
    summary: List a task's execution messages
    description: >-
      server/internal/handler/daemon.go:5783-5851
      (`ListTaskMessagesByUser`). User-facing (not daemon auth) counterpart
      to the daemon's own task-message ingest. Verifies the task belongs to
      the caller's workspace by resolving the task's OWN workspace
      (`ResolveTaskWorkspaceIDChecked`, which covers issue-linked,
      chat-linked, and run_only/autopilot-linked tasks alike) and comparing
      it against the request's resolved workspace — a mismatch is reported
      as 404, identical to a genuinely nonexistent task, so a task in
      another workspace cannot be distinguished from one that doesn't
      exist. Unlike the other operations in this file there is no separate
      private-agent view gate here — any member of the task's workspace may
      read its messages.
    tags: [tasks]
    security: *agentsAuth
    parameters:
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: taskId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: since
        in: query
        schema: { type: integer }
        description: >-
          Exclusive lower bound on `seq`; when present, uses
          ListTaskMessagesSince instead of the full ListTaskMessages. A
          non-integer value is a 400.
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/TaskMessagePayload' }
      '400':
        description: 'Common workspace-gate 400s (see file header), plus: "invalid task_id"; "invalid since parameter".'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        description: 'Common workspace-gate 403 (see file header).'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
      '404':
        description: >-
          Common workspace-gate 404 (see file header), or "task not found"
          (the task id doesn't exist, or its resolved workspace does not
          match the caller's — the two cases are deliberately
          indistinguishable).
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "task not found" }
      '500':
        description: >-
          "failed to load task" (GetAgentTask failed for a reason other than
          not-found, or ResolveTaskWorkspaceIDChecked failed); "failed to
          list task messages".
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }

/api/tasks/{taskId}/cancel:
  post:
    operationId: cancelTaskByUser
    summary: Cancel a task as its owning user
    description: >-
      server/internal/handler/chat.go:1760-1904 (`CancelTaskByUser`).
      Tenancy is enforced uniformly through the task's owning agent
      (`GetAgentTaskInWorkspace`) rather than its optional issue/chat/
      autopilot source FK — this is what makes run_only autopilot tasks and
      pre-link quick-create tasks (whose issue does not exist yet)
      cancellable at all (MUL-2827). On top of tenancy, two distinct privacy
      gates layer on: a CHAT task may only be cancelled by the member who
      opened that conversation (even though the workspace is shared); every
      other task (issue / autopilot / quick_create) is gated by the same
      `canAccessPrivateAgent` check used by the Agent Activity tab and the
      workspace task snapshot, so cancellation is never more permissive than
      the surface that exposes the task in the first place. Supports an
      optional "cancel a still-QUEUED chat task and either restore or
      discard its pending draft" mode via `expected_status`/
      `chat_session_id`/`queue_action`.
    tags: [tasks]
    security: *agentsAuth
    parameters:
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: taskId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: expected_status
        in: query
        schema: { type: string, enum: [queued] }
        description: >-
          Only "queued" is accepted when present (a 400 otherwise). Switches
          to the queued-only cancel path, which additionally requires
          `chat_session_id` and `queue_action`, and fails with 409 instead of
          succeeding if the task is no longer queued by the time the cancel
          runs (a dispatch race).
      - name: chat_session_id
        in: query
        schema: { type: string, format: uuid }
        description: 'Required when expected_status=queued. Must match the task''s own chat_session_id exactly (a 409 on mismatch) — see the 409 response.'
      - name: queue_action
        in: query
        schema: { type: string, enum: [edit, remove] }
        description: >-
          Required when expected_status=queued. "edit" tells the response to
          restore the queued message''s content to the composer
          (restore_to_input: true); "remove" discards it.
    responses:
      '200':
        description: >-
          OK. `cancelled_chat_message` is present only for a queued chat
          task cancelled via expected_status=queued.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelTaskByUserResponse' }
      '400':
        description: >-
          Common workspace-gate 400s (see file header), plus: "invalid
          workspace id"; "invalid task id"; "expected_status must be
          queued"; "invalid chat_session_id"; "queue_action must be edit or
          remove"; any other error surfaced verbatim from
          `TaskService.CancelTaskWithResult` (e.g. the task is already in a
          terminal state — exact message is the underlying DB/service error,
          not independently enumerated here).
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        description: >-
          Common workspace-gate 403 (see file header); "not your task" (a
          chat task owned by a different member); or "you do not have
          access to this agent" (non-chat task, private-agent gate).
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
      '404':
        description: >-
          Common workspace-gate 404 (see file header), or "task not found"
          (task id doesn't resolve in this workspace, or — for a chat task —
          its chat session lookup failed).
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "task not found" }
      '409':
        description: >-
          "task does not belong to the expected chat session" (chat_session_id
          query param doesn't match the task's own); or "task is no longer
          queued" (ErrTaskNoLongerQueued — a queued-only cancel lost a race
          with dispatch).
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            examples:
              sessionMismatch: { value: { error: "task does not belong to the expected chat session" } }
              noLongerQueued: { value: { error: "task is no longer queued" } }
