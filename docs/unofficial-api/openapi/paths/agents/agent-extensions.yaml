/api/agents/{id}/mcp-servers/{serverId}:
  delete:
    operationId: removeAgentMcpServer
    summary: Unbind a workspace MCP server from an agent
    description: >-
      server/internal/handler/workspace_mcp_api.go:497-516ish
      (`RemoveAgentMcpServer`), same `requireAgentMcpWriter` gate. The
      workspace library entry itself is untouched — only this agent's
      binding is deleted. Like `removeAgentSkill`, responds `200` with the
      agent's resulting MCP server list rather than `204`, but UNLIKE
      `removeAgentSkill` it DOES 404 when `{serverId}` was not actually
      bound to this agent (the `DELETE` affecting zero rows is treated as
      not-found here, not as a silent success) — the two "remove a binding"
      endpoints in this ticket's scope disagree on this point.
    tags: [agent-mcp-servers]
    security: *agentExtAuth
    parameters:
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: serverId
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      '200':
        description: OK — the agent's resulting MCP server list.
        content:
          application/json:
