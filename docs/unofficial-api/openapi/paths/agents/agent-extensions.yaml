          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "failed to list the agent's MCP servers" }
  post:
    operationId: addAgentMcpServer
    summary: Bind a workspace MCP server to an agent
    description: >-
      server/internal/handler/workspace_mcp_api.go:395-432ish
      (`AddAgentMcpServer`), gated by `requireAgentMcpWriter` (367-383):
      agent actors are unconditionally denied (same `resolveActor ==
      "agent"` rejection pattern as the env endpoints), and among human
      callers only `canViewAgentSecrets` (workspace owner/admin, or this
      agent's owner) may bind. This is the only way a workspace MCP library
      entry reaches an agent. Takes `LockWorkspaceForChatSessionCreate`
      (the #5219 delete fence) plus `LockWorkspaceMcpServerForShare` on the
      target server row — the latter both scopes the server to this
      agent's workspace AND serializes the insert against
      `DeleteWorkspaceMcpServer`'s sweep of the junction table, which has no
      FK to catch an orphaned row otherwise. The underlying insert is `ON
      CONFLICT DO NOTHING` (`agent_mcp_server` has no uniqueness problem
      here, unlike the skill-binding additive endpoint above) — re-adding
      an already-bound server is a harmless no-op, not an error.
    tags: [agent-mcp-servers]
    security: *agentExtAuth
    parameters:
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AddAgentMcpServerRequest' }
    responses:
      '200':
        description: OK — the agent's resulting MCP server list (includes the newly bound entry, or is unchanged if it was already bound).
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/WorkspaceMcpServerResponse' }
      '400':
        description: '`workspace_id` could not be resolved; `{id}` / the resolved workspace id is not a parseable UUID; the request body is invalid; or `server_id` is not a parseable UUID.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            examples:
              workspaceIdRequired: { value: { error: "workspace_id is required" } }
              invalidAgentId: { value: { error: "invalid agent id" } }
              invalidWorkspaceId: { value: { error: "invalid workspace id" } }
              invalidBody: { value: { error: "invalid request body" } }
              invalidServerId: { value: { error: "invalid server_id" } }
      '401':
        description: Not authenticated.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "user not authenticated" }
      '403':
        description: >-
          The request authenticated with an AgentTaskToken (agent actor,
          unconditionally denied); or the caller is a human member but
          neither this agent's owner nor a workspace owner/admin.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            examples:
              agentActor: { value: { error: "agents cannot modify MCP server assignments" } }
              notAuthorized: { value: { error: "insufficient permissions" } }
      '404':
        description: >-
          `{id}` does not resolve to an agent in this workspace; the
          workspace was deleted concurrently (`LockWorkspaceForChatSessionCreate`
          finds no row); or `server_id` does not resolve to a workspace MCP
          library entry in this agent's workspace.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            examples:
              agentNotFound: { value: { error: "agent not found" } }
              workspaceNotFound: { value: { error: "workspace not found" } }
              serverNotFound: { value: { error: "MCP server not found in this workspace" } }
      '500':
        description: '"failed to add the MCP server" (tx begin, the insert itself, or tx commit); or "failed to list the agent''s MCP servers" from the post-write re-read.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }

