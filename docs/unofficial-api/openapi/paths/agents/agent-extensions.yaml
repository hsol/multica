        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            examples:
              agentActor: { value: { error: "agents cannot modify MCP server assignments" } }
              notAuthorized: { value: { error: "insufficient permissions" } }
      '404':
        description: '`{id}` does not resolve to an agent in this workspace; or `{serverId}` was not bound to this agent (the `DELETE` affected zero rows).'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            examples:
              agentNotFound: { value: { error: "agent not found" } }
              bindingNotFound: { value: { error: "this MCP server is not assigned to the agent" } }
      '500':
